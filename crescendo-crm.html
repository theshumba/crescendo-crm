.sig-card.sig-highlight { border-color: var(--color-primary); background: var(--color-primary-highlight); }
.sig-card pre { font-family: var(--font-body); font-size: var(--text-sm); white-space: pre-wrap; line-height: 1.6; margin-bottom: var(--space-3); }
.sig-copy-btn { font-size: var(--text-xs); }

/* ========== REPORTS SECTION ========== */
.reports-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-6); }
.report-stat-card { background: var(--color-surface); border: 1px solid oklch(from var(--color-text) l c h / 0.08); border-radius: var(--radius-lg); padding: var(--space-4); text-align: center; }
.report-stat-value { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; color: var(--color-primary); }
.report-stat-label { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: var(--space-1); }
.report-comparison { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: var(--space-4); }
.report-user-card { background: var(--color-surface); border: 1px solid oklch(from var(--color-text) l c h / 0.08); border-radius: var(--radius-lg); padding: var(--space-5); }
.report-user-card h3 { font-family: var(--font-display); font-size: var(--text-sm); font-weight: 700; margin-bottom: var(--space-3); }
.report-user-stat { display: flex; justify-content: space-between; padding: var(--space-2) 0; font-size: var(--text-sm); border-bottom: 1px solid oklch(from var(--color-text) l c h / 0.04); }

/* ========== AI CHATBOT ========== */
.chat-fab { position: fixed; bottom: var(--space-6); right: var(--space-6); width: 56px; height: 56px; border-radius: 50%; background: var(--color-primary); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px oklch(0.2 0.01 80 / 0.25); z-index: 90; transition: transform var(--transition-interactive), box-shadow var(--transition-interactive); }
@media (hover: hover) and (pointer: fine) { .chat-fab:hover { transform: scale(1.06); box-shadow: 0 6px 20px oklch(0.2 0.01 80 / 0.3); } }
.chat-fab:active { transform: scale(0.94); }
.chat-fab svg { width: 26px; height: 26px; }

.chat-panel { position: fixed; bottom: calc(var(--space-6) + 66px); right: var(--space-6); width: 380px; height: 500px; background: var(--color-surface); border: 1px solid oklch(from var(--color-text) l c h / 0.12); border-radius: var(--radius-xl); box-shadow: 0 8px 32px oklch(0.2 0.01 80 / 0.15); z-index: 95; display: flex; flex-direction: column; overflow: hidden; transform: translateY(20px) scale(0.95); opacity: 0; pointer-events: none; transition: transform 250ms var(--ease-out), opacity 200ms ease; }
.chat-panel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }

.chat-header { padding: var(--space-3) var(--space-4); background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.chat-header-left { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-display); font-weight: 700; font-size: var(--text-sm); }
.chat-header-actions { display: flex; gap: var(--space-1); }
.chat-header-actions button { background: none; border: none; color: #fff; cursor: pointer; padding: var(--space-2); border-radius: var(--radius-sm); opacity: 0.8; min-height: 36px; }
.chat-header-actions button:hover { opacity: 1; background: oklch(1 0 0 / 0.15); }
.chat-header-actions button.active { opacity: 1; background: oklch(1 0 0 / 0.2); }

.chat-tabs { display: flex; border-bottom: 1px solid oklch(from var(--color-text) l c h / 0.08); flex-shrink: 0; }
.chat-tab { flex: 1; padding: var(--space-2); text-align: center; font-size: var(--text-xs); font-weight: 600; cursor: pointer; border: none; background: none; color: var(--color-text-muted); border-bottom: 2px solid transparent; }
.chat-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }

.chat-messages { flex: 1; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); overscroll-behavior: contain; }
.chat-msg { max-width: 85%; padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); font-size: var(--text-sm); line-height: 1.5; word-break: break-word; }
.chat-msg.user { align-self: flex-end; background: var(--color-primary); color: #fff; border-bottom-right-radius: var(--radius-sm); }
.chat-msg.ai { align-self: flex-start; background: var(--color-surface-offset); color: var(--color-text); border-bottom-left-radius: var(--radius-sm); }
.chat-msg.system { align-self: center; background: var(--color-surface-offset); color: var(--color-text-muted); font-size: var(--text-xs); text-align: center; max-width: 100%; }

.chat-typing { display: flex; gap: 4px; padding: var(--space-3) var(--space-4); align-self: flex-start; }
.chat-typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--color-text-faint); animation: chatDot 1.4s infinite; }
.chat-typing span:nth-child(2) { animation-delay: 0.2s; }
.chat-typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes chatDot { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

.chat-input-area { padding: var(--space-3); border-top: 1px solid oklch(from var(--color-text) l c h / 0.08); display: flex; gap: var(--space-2); flex-shrink: 0; }
.chat-input-area input { flex: 1; border: 1px solid oklch(from var(--color-text) l c h / 0.12); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); font-size: max(16px, var(--text-sm)); background: var(--color-surface); min-height: 44px; min-width: 0; }
.chat-input-area button { background: var(--color-primary); color: #fff; border: none; border-radius: var(--radius-md); padding: var(--space-2) var(--space-4); cursor: pointer; font-size: var(--text-sm); font-weight: 600; min-height: 44px; }
.chat-input-area button:hover { background: var(--color-primary-hover); }

.chat-settings { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; overflow-y: auto; }
.chat-settings label { font-size: var(--text-sm); font-weight: 600; display: block; margin-bottom: var(--space-1); }
.chat-settings input { width: 100%; border: 1px solid oklch(from var(--color-text) l c h / 0.12); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); font-size: max(16px, var(--text-sm)); min-height: 44px; }
.chat-settings p { font-size: var(--text-xs); color: var(--color-text-muted); }

.chat-learnings { flex: 1; overflow-y: auto; padding: var(--space-4); }
.chat-learning-item { padding: var(--space-3); background: var(--color-surface-offset); border-radius: var(--radius-md); margin-bottom: var(--space-2); font-size: var(--text-sm); }

/* Reset Data button */
.reset-data-btn { background: none; border: 1px solid var(--color-error); color: var(--color-error); border-radius: var(--radius-sm); padding: var(--space-2); font-size: 0.65rem; cursor: pointer; margin-top: var(--space-2); display: block; width: 100%; min-height: 34px; }
.reset-data-btn:hover { background: var(--color-error-highlight); }

/* Sidebar links */
.sidebar-link { display: block; padding: var(--space-2) 0; font-size: var(--text-xs); color: var(--color-text-muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; background: none; border: none; text-align: left; width: 100%; min-height: 34px; }
.sidebar-link:hover { color: var(--color-primary); }

/* ========== PIPELINE VALUE BAR ========== */
.pipeline-bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-4); padding: var(--space-4) var(--space-5); margin-bottom: var(--space-4); background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
.pipeline-stat { display: inline-flex; align-items: baseline; gap: var(--space-2); }
.pipeline-stat-value { font-family: var(--font-display); font-weight: 800; font-size: var(--text-2xl); color: var(--color-text); line-height: 1; }
.pipeline-stat-label { font-size: var(--text-xs); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.pipeline-sep { color: var(--color-text-faint); font-weight: 700; }
.pipeline-meta { margin-left: auto; font-size: var(--text-xs); color: var(--color-text-muted); }

/* ========== DEAL VALUE INPUT ========== */
.deal-value-wrap { margin-top: var(--space-1); }
.deal-value-wrap.prominent { padding: var(--space-2) var(--space-3); background: var(--color-primary-highlight); border-radius: var(--radius-md); }
.deal-value-input { display: inline-flex; align-items: center; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 2px 8px; gap: 2px; min-height: 40px; }
.deal-value-input .deal-currency { font-weight: 600; color: var(--color-text-muted); }
.deal-value-input input { border: none; outline: none; background: transparent; width: 96px; padding: 4px 0; font-size: var(--text-sm); color: var(--color-text); font-weight: 600; }
.deal-value-wrap.prominent .deal-value-input input { font-size: var(--text-base); }
.deal-badge { background: oklch(from var(--color-primary) l c h / 0.12); color: var(--color-primary); font-weight: 600; }

/* ========== TODAY CHIP ========== */
.today-chip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-full); background: var(--color-surface); font-size: var(--text-xs); font-weight: 600; color: var(--color-text-muted); cursor: pointer; transition: background var(--transition-interactive), color var(--transition-interactive), border-color var(--transition-interactive), transform 140ms var(--ease-out); min-height: 36px; }
.today-chip:hover { color: var(--color-text); border-color: var(--color-primary); }
.today-chip:active { transform: scale(0.96); }
.today-chip.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.today-chip i { width: 14px; height: 14px; }

/* ========== FOLLOW-UP STRIP (Outreach) ==========
   What is owed to the rep, on the screen where they work. It used to live only on Home. */
.followup-strip { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-3) var(--space-4); margin-bottom: var(--space-3); background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
.followup-strip-label { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-muted); margin-right: var(--space-1); }
.followup-strip-label i { width: 14px; height: 14px; }
.followup-strip-sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 0 var(--space-1); }
@media (max-width: 900px) { .followup-strip-sep { display: none; } }
.fu-chip { display: inline-flex; align-items: baseline; gap: 5px; padding: 5px 11px; border: 1px solid var(--color-border); border-radius: var(--radius-full); background: var(--color-surface); font-size: var(--text-xs); font-weight: 600; color: var(--color-text-muted); cursor: pointer; min-height: 34px; transition: background var(--transition-interactive), color var(--transition-interactive), border-color var(--transition-interactive), transform 140ms var(--ease-out); }
.fu-chip strong { font-family: var(--font-display); font-size: var(--text-base); font-weight: 800; color: var(--color-text); line-height: 1; }
.fu-chip:hover { border-color: var(--color-primary); color: var(--color-text); }
.fu-chip:active { transform: scale(0.96); }
.fu-chip.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
.fu-chip.fu-overdue strong { color: var(--color-error); }
.fu-chip.fu-today strong { color: var(--color-warning); }
.fu-chip.fu-none strong { color: var(--color-text-faint); }
.fu-chip.fu-worked strong { color: var(--color-success); }
.fu-chip.fu-stalled strong { color: var(--color-warning); }
.crm-entered.stalled { color: var(--color-warning); font-weight: 600; }
.fu-chip.active strong, .fu-chip.active { color: #fff; }
.kanban-column-tally { display: inline-flex; align-items: center; gap: 5px; }

/* Filtered-view notice: a lead that is merely hidden must never read as a lead that vanished. */
.filter-notice { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-2) var(--space-3); margin-bottom: var(--space-3); border: 1px solid var(--color-primary); background: var(--color-primary-highlight); border-radius: var(--radius-md); font-size: var(--text-xs); color: var(--color-text); }
.filter-notice i { width: 14px; height: 14px; flex-shrink: 0; }
.filter-notice .btn { margin-left: auto; }

/* ========== CRM LEAD SHEET (opened from a board card) ========== */
@keyframes crm-sheet-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes crm-sheet-in { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.crm-sheet-overlay { position: fixed; inset: 0; background: oklch(from var(--color-text) l c h / 0.45); z-index: 90; animation: crm-sheet-fade 160ms var(--ease-out); }
/* inset+margin:auto centres it without a transform, leaving transform free for the animation. */
.crm-sheet { position: fixed; z-index: 91; inset: 0; margin: auto; width: min(760px, calc(100vw - 2rem)); height: max-content; max-height: calc(100vh - 3rem); display: flex; flex-direction: column; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: 0 24px 60px oklch(from var(--color-text) l c h / 0.25); animation: crm-sheet-in 200ms var(--ease-out); }
.crm-sheet-bar { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); }
.crm-sheet-nav, .crm-sheet-close { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border: 1px solid var(--color-border); border-radius: var(--radius-full); background: var(--color-surface); color: var(--color-text-muted); cursor: pointer; }
.crm-sheet-nav:hover:not(:disabled), .crm-sheet-close:hover { color: var(--color-text); border-color: var(--color-primary); }
.crm-sheet-nav:disabled { opacity: 0.35; cursor: default; }
.crm-sheet-nav i, .crm-sheet-close i { width: 16px; height: 16px; }
.crm-sheet-close { margin-left: auto; }
.crm-sheet-pos { font-size: var(--text-xs); font-weight: 600; color: var(--color-text-muted); }
.crm-sheet-body { overflow-y: auto; padding: var(--space-4); -webkit-overflow-scrolling: touch; }
.crm-sheet-contact { padding: var(--space-3) var(--space-4); margin-bottom: var(--space-3); background: var(--color-surface-offset); border-radius: var(--radius-md); display: flex; flex-direction: column; gap: 5px; }
.crm-sheet-person { font-weight: 700; font-size: var(--text-sm); }
.crm-sheet-line { display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--color-text-muted); word-break: break-word; }
.crm-sheet-line i { width: 14px; height: 14px; flex-shrink: 0; }
.crm-sheet-line a { color: var(--color-primary); text-decoration: underline; text-underline-offset: 2px; }
.crm-sheet-muted { color: var(--color-text-faint); }
/* Inside the sheet the record is the whole point — never collapse it. Two columns, not the
   list view's three: the sheet is 760px wide, not the full page. */
.crm-sheet .crm-details { display: grid !important; grid-template-columns: 1fr; }
@media (min-width: 700px) { .crm-sheet .crm-details { grid-template-columns: repeat(2, 1fr); } }
.crm-sheet .crm-expand-btn, .crm-sheet .bulk-check { display: none !important; }
.crm-sheet .crm-card { border: none; padding: 0; background: transparent; box-shadow: none; }
@media (max-width: 700px) {
  .crm-sheet { inset: auto 0 0 0; margin: 0; width: 100vw; max-height: 88vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
}

/* Board card extras: the phone and the day it landed in this column. */
.card-phone { display: flex; align-items: center; gap: 4px; font-size: var(--text-2xs); color: var(--color-text-muted); margin-top: 2px; }
.card-phone i { width: 11px; height: 11px; }
.card-entered { font-size: var(--text-2xs); color: var(--color-text-faint); margin-top: 2px; }
.kanban-column-today { font-size: var(--text-2xs); font-weight: 700; padding: 2px 7px; border-radius: var(--radius-full); background: var(--color-success-highlight); color: var(--color-success); white-space: nowrap; }
.crm-entered { color: var(--color-text-faint); }
.lead-card-phone { display: inline-flex; align-items: center; gap: 4px; color: var(--color-primary); text-decoration: underline; text-underline-offset: 2px; }
.lead-card-phone i { width: 12px; height: 12px; }
.lead-card-nophone { color: var(--color-text-faint); }
.work-list-btn { margin-right: var(--space-1); }
.crm-sheet-bar.working { background: var(--color-primary-highlight); border-bottom-color: var(--color-primary); }
.crm-sheet-skip { margin-left: var(--space-1); }
.report-rate { font-size: var(--text-2xs); font-weight: 600; color: var(--color-text-muted); }
.priority-more { padding: var(--space-3); font-size: var(--text-xs); color: var(--color-text-muted); display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.qual-bulk-row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); }
.lead-card .bulk-check { margin-right: 6px; vertical-align: -1px; }
.lead-card.selected { border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary) inset; }

/* ========== BULK ACTIONS BAR ========== */
.bulk-bar { display: none; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-3); background: var(--color-text); color: var(--color-text-inverse); border-radius: var(--radius-lg); animation: slide-down 220ms var(--ease-out); flex-wrap: wrap; }
.bulk-bar.active { display: flex; }
.bulk-count { font-weight: 700; font-size: var(--text-sm); }
.bulk-action-select { max-width: 240px; }
@keyframes slide-down { from { transform: translateY(-8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.bulk-check { width: 18px; height: 18px; cursor: pointer; accent-color: var(--color-primary); flex-shrink: 0; }
.card.crm-card.selected, .card.crm-row.selected, .card.lead-card.selected { outline: 2px solid var(--color-primary); outline-offset: 0; }

/* ========== HOME / DASHBOARD ========== */
.home-greeting { margin-bottom: var(--space-6); }
.home-greeting h1 { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 800; margin-bottom: var(--space-1); letter-spacing: -0.01em; }
.home-greeting p { color: var(--color-text-muted); font-size: var(--text-sm); }
.home-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-6); }
.home-stat-card { padding: var(--space-4) var(--space-5); background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
.home-stat-card .stat-label { font-size: var(--text-2xs); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: var(--space-2); font-weight: 600; }
.home-stat-card .stat-value { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 800; color: var(--color-text); line-height: 1.1; }
.home-stat-card.accent { border-left: 4px solid var(--color-primary); }
.home-columns { display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-6); }
@media (max-width: 880px) { .home-columns { grid-template-columns: 1fr; } }
.home-section-title { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; margin-bottom: var(--space-3); }
.priority-list { display: flex; flex-direction: column; gap: var(--space-2); }
.priority-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); cursor: pointer; transition: background var(--transition-interactive); flex-wrap: wrap; }
.priority-item:hover { background: var(--color-surface-offset); }
.priority-item.overdue { border-left: 4px solid var(--color-error); }
.priority-item.today { border-left: 4px solid var(--color-warning); }
.priority-item.opportunity { border-left: 4px solid var(--color-primary); }
.priority-item .pi-title { font-weight: 600; color: var(--color-text); overflow-wrap: anywhere; }
.priority-item .pi-meta { font-size: var(--text-xs); color: var(--color-text-muted); }
.priority-item .pi-spacer { flex: 1; }
.recent-activity-feed { display: flex; flex-direction: column; gap: var(--space-2); }
.recent-activity-item { padding: var(--space-2) var(--space-3); background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--text-sm); }
.recent-activity-item .ra-meta { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 2px; }

/* ========== BRIEF MODAL ========== */
.brief-doc { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-5); font-family: var(--font-sans); font-size: var(--text-sm); line-height: 1.55; white-space: pre-wrap; max-height: 60vh; overflow-y: auto; color: var(--color-text); }
.brief-section { margin-bottom: var(--space-4); }
.brief-section h4 { font-family: var(--font-display); font-size: var(--text-sm); text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-muted); margin-bottom: var(--space-1); }
.brief-section p, .brief-section ul { font-size: var(--text-sm); color: var(--color-text); }

/* ========== DUPLICATE WARNING ========== */
.dup-warning { display: block; margin-top: 4px; padding: 6px 10px; background: var(--color-warning-highlight); color: var(--color-warning); border-radius: var(--radius-sm); font-size: var(--text-xs); font-weight: 500; }

/* ========== WIN/LOSS MODAL ========== */
.outcome-reasons { display: flex; flex-direction: column; gap: var(--space-2); margin: var(--space-3) 0; }
.outcome-reason { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md); cursor: pointer; min-height: 48px; transition: background var(--transition-interactive), border-color var(--transition-interactive); }
.outcome-reason:hover { background: var(--color-surface-offset); }

const state = {

  activeSection: 'home',
  crmView: 'list',
  meetingsView: 'list',
  calendarMonth: new Date().getMonth(),
  calendarYear: new Date().getFullYear(),
  archiveTab: 'follow_up',
  filters: {
    leadBank: { search: '', status: 'all', source: 'all', assignedTo: 'all', today: false },
    crm: { search: '', stage: 'all', priority: 'all', overdueOnly: false, assignedTo: 'all', today: false, touchedToday: false, stalled: false, followUp: 'all' },
    qualified: { search: '', industry: 'all', city: 'all', source: 'all', assignedTo: 'all', hasPhone: false, sort: 'score' },
    archive: {}

  panelOpen: false,
  modalOpen: false,
  panelTrigger: null,
  modalTrigger: null,
  expandedNotes: {},
  deleteConfirm: {},
  calendarPopover: null,
  bulkSelection: [],
  bulkScope: null, // 'crm' | 'lead-bank'
  crmDetailsOpen: {},   // per-lead expanded state for the mobile CRM card details
  crmSheetId: null,     // lead whose full record is open over the board (null = closed)
  pendingCall: null,    // {id, at}, lead just dialled, outcome asked for on return
  workList: null,       // frozen queue of due lead ids while working the list
  archiveOverdueOnly: false, // archive banner toggle: show only leads whose follow-up is overdue
  lbLimit: 60,          // lead-bank incremental render limit (reset on filter change)
  crmLimit: 40,         // CRM list incremental render limit
  qualLimit: 60         // qualified-leads incremental render limit
};
const LB_PAGE = 60;
const CRM_PAGE = 40;
const QUAL_PAGE = 60;
// Content hash per lead, so saveState can tell which leads a write actually touched.
// Declared up here, not next to saveState: loadState() seeds it and runs long before that
// point in the file, and a `const` in the temporal dead zone throws — which loadState swallows,
// silently dropping every stored lead and booting the app on sample data.
const __leadHashes = new Map(); // id -> last-seen content hash (set on save & on remote merge)

// ========== CRESCENDO SYNC (Firestore shared backend) ==========
// Syncs state.leads across all devices so the Master view can see everyone's work.
// Safely no-ops if Firebase config is left as placeholders — app still works offline.
const CrescendoSync = (function () {
  let db = null;
  let auth = null;
  let ready = false;
  let unsubscribeLeads = null;
  let applyingRemote = false;       // guard so onSnapshot callbacks don't re-push writes
  let lastPushed = new Map();       // leadId -> JSON string of last-pushed lead (echo key)
  let pushTimer = null;
  let pendingPush = false;
  let lastLeads = null;             // latest leads array handed to pushLeads (for flush())
  let retryDelay = 0;               // ms backoff after a transient failure; 0 = healthy
  let lastSyncedAt = null;          // Date of the last successful cloud round-trip
  let warnedCreateBlocked = false;  // one-time notice when the cloud create circuit-breaker bites
  let netListenersAttached = false;
  // Echo-dedup key: the lead minus volatile server-side fields. _srvAt is a serverTimestamp
  // sentinel on write but a resolved Timestamp on read, so it must be stripped from the key
  // or every push would look "changed" and loop forever (M1 safety).
  function _echoKey(lead) { const o = { ...lead }; delete o._srvAt; return o; }
  let onRemoteCb = null;
  let firstSnapshotSeen = false;    // becomes true after the first remote snapshot arrives

      const CHUNK = 450;

      // Permission-denied ⇒ almost certainly a NEW lead doc hitting the cloud's create
      // circuit-breaker. Mark that exact content BLOCKED so we don't hammer it on every
      // save, and tell the rep once — their updates to existing leads still sync fine.
      for (const f of permanent) {

        if (!pushTimer) pushTimer = setTimeout(_run, retryDelay);

      } else {
        showSyncStatus('connected');
      }
    } catch (e) {
      console.warn('[CrescendoSync] Push failed:', e);
      pendingPush = true;
      retryDelay = retryDelay ? Math.min(retryDelay * 2, 60000) : 5000;
      if (!pushTimer) pushTimer = setTimeout(_run, retryDelay);

    }
  }

  async function _run() {
    pushTimer = null;
    if (!pendingPush) return;
    pendingPush = false;

  // Push changed leads to Firestore. Debounced to coalesce rapid edits.

  // and when the page is backgrounded, so a claim/edit isn't dropped when the phone
  // suspends the tab. Returns a Promise; never rejects (errors surface via showSyncStatus).

}

function isMasterUser() {

}
const CONSULTANTS = ['Muneeb Moiz', 'Yousuf Zacky', 'Ameer Munj', 'Amir Hasbullah'];
const CEOS = ['Melusi Ndoro', 'Joshua Khalili', 'Ayoub Rasol', 'Adan'];

// power (Activity Monitor, export, reassign) and additionally behave exactly like a rep —
// their work tags to them and they appear on every assign / filter / report surface. Without
// this, a lead they moved to the CRM stayed tagged to whoever the seed assigned it to, so
// their own work was invisible to them and to the "Mine" views.
const SELLING_LEADERS = ['Joshua Khalili', 'Adan'];

// reassign list and per-rep filter. Consultants first, then the leaders who also sell.
const SALES_TEAM = [...CONSULTANTS, ...SELLING_LEADERS];

function isSalesUser() {

// Oversight-only logins (Master, and CEOs who don't personally call) must never grab the
// "who's on it" tag — they reassign deliberately instead.
function isOversightOnly() {

}

// 'Master' (any case/spacing) must never resolve to the owner identity (C4).
const RESERVED_MASTER_NAME = 'master';

  try { const r = JSON.parse(localStorage.getItem('crescendo-custom-reps') || '[]'); return Array.isArray(r) ? r : []; }
  catch (_) { return []; }
}
function addCustomRep(name) {

  const all = [...CEOS, ...CONSULTANTS, ...getCustomReps()];
  const seen = new Set();
  return all.filter(n => {

// Collapse a free-typed name onto its existing canonical spelling if one exists

function resolveRepName(name) {

  if (!clean) return clean;
  // SECURITY: 'Master' (any case) is NOT resolvable here — the owner identity may only be
  // assumed through the PIN gate. Free-typed 'master' is treated as an ordinary (invalid)
  // rep name so it can never grant owner powers (C4).
  if (clean.toLowerCase() === RESERVED_MASTER_NAME) return clean;
  // A corrected spelling collapses onto the right roster name, so anything already written
  // under the old one folds into the same person instead of splitting his history.
  for (const w in NAME_CORRECTIONS) {

  const lc = clean.toLowerCase();
  const canonical = [...CEOS, ...CONSULTANTS].find(n => n.toLowerCase() === lc);

  if (lead.contacts && lead.contacts.length > 0 && lead.contacts[0].name) score += 10;
  if ((lead.emails && lead.emails.length > 0) || (lead.contacts && lead.contacts.some(c => c.email))) score += 10;
  if ((lead.phones && lead.phones.length > 0) || (lead.contacts && lead.contacts.some(c => c.phone))) score += 5;
  return Math.min(score, 100);
}
function renderScoreBadge(lead) {
  const score = getOpportunityScore(lead);
  const cls = score >= 70 ? 'score-high' : score >= 40 ? 'score-mid' : 'score-low';
  return '<span class="opp-score-badge ' + cls + '" title="Opportunity Score: ' + score + '">' + score + '</span>';
}

// ========== DEAL VALUE & PIPELINE ==========
const STAGE_PROBABILITY = { 1: 0.05, 2: 0.15, 3: 0.35, 4: 0.50, 5: 0.70, 6: 1.00 };
function getDealValue(lead) {
  if (!lead || !lead.crm) return 0;
  const v = Number(lead.crm.dealValue);
  return Number.isFinite(v) ? v : 15000;
}
function formatMoney(n) {
  const v = Number(n) || 0;
  if (Math.abs(v) >= 1000000) return '£' + (v / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (Math.abs(v) >= 1000) return '£' + Math.round(v / 1000) + 'K';
  return '£' + Math.round(v);
}
function formatMoneyFull(n) {
  const v = Number(n) || 0;
  return '£' + v.toLocaleString('en-GB');
}
function computePipeline(leads) {
  const open = leads.filter(l => l.status === 'crm' && l.crm && l.crm.stage !== 6);
  const won  = leads.filter(l => l.status === 'crm' && l.crm && l.crm.stage === 6);
  const total = open.reduce((s, l) => s + getDealValue(l), 0);
  const closed = won.reduce((s, l) => s + getDealValue(l), 0);
  const weighted = open.reduce((s, l) => s + getDealValue(l) * (STAGE_PROBABILITY[l.crm.stage] || 0), 0);
  return { total, closed, weighted, openCount: open.length, wonCount: won.length };
}

// ========== MAP ==========
// UK city-centroid lookup. Offline-first geocoding — leads are placed by matching
// their (free-text) `address` string against these city names. No API key required.
const GEO_CENTROIDS = {
  'london': [51.5074, -0.1278], 'manchester': [53.4808, -2.2426], 'birmingham': [52.4862, -1.8904],
  'leeds': [53.8008, -1.5491], 'liverpool': [53.4084, -2.9916], 'bristol': [51.4545, -2.5879],
  'sheffield': [53.3811, -1.4701], 'edinburgh': [55.9533, -3.1883], 'glasgow': [55.8642, -4.2518],
  'newcastle': [54.9783, -1.6178], 'nottingham': [52.9548, -1.1581], 'leicester': [52.6369, -1.1398],
  'oxford': [51.7520, -1.2577], 'brighton': [50.8225, -0.1372], 'cardiff': [51.4816, -3.1791],
  'belfast': [54.5973, -5.9301], 'norwich': [52.6309, 1.2974], 'york': [53.9590, -1.0815],
  'cambridge': [52.2053, 0.1218], 'reading': [51.4543, -0.9781], 'southampton': [50.9097, -1.4044],
  'portsmouth': [50.8198, -1.0880], 'coventry': [52.4068, -1.5197], 'hull': [53.7676, -0.3274],
  'plymouth': [50.3755, -4.1427], 'aberdeen': [57.1497, -2.0943], 'dundee': [56.4620, -2.9707],
  'bath': [51.3811, -2.3590], 'exeter': [50.7184, -3.5339], 'milton keynes': [52.0406, -0.7594]
};

// Deterministic hash-based jitter (±~0.06°) so co-located leads don't stack on one pixel.
function geoJitter(seed) {
  let h = 0;
  const s = String(seed || '');
  for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) & 0xffff; }
  const dx = ((h % 100) / 100 - 0.5) * 0.12;
  const dy = (((h >> 5) % 100) / 100 - 0.5) * 0.12;
  return [dx, dy];
}

// Persistent cache for runtime Nominatim lookups (best-effort, never blocks render).
function loadGeoCache() {
  try { return JSON.parse(localStorage.getItem('crescendo-geocache') || '{}') || {}; }
  catch (_) { return {}; }
}
function saveGeoCache(cache) {
  try { localStorage.setItem('crescendo-geocache', JSON.stringify(cache)); } catch (_) {}
}

// Resolve a [lat,lng] for a lead synchronously from the centroid table, or null.
function geocodeLead(l) {
  if (!l) return null;
  // Explicit coordinates win.
  const lat = Number(l.lat), lng = Number(l.lng);
  if (Number.isFinite(lat) && Number.isFinite(lng) && (lat !== 0 || lng !== 0)) return [lat, lng];
  const addr = (typeof l.address === 'string') ? l.address.trim().toLowerCase() : '';
  if (!addr) return null;
  // Substring match against known city centroids.
  for (const city of Object.keys(GEO_CENTROIDS)) {
    if (addr.includes(city)) {
      const [j1, j2] = geoJitter(l.id || addr);
      return [GEO_CENTROIDS[city][0] + j1, GEO_CENTROIDS[city][1] + j2];
    }
  }
  // Cached runtime (Nominatim) result, if any.
  const cache = loadGeoCache();
  if (cache[addr] && Array.isArray(cache[addr])) {
    const [j1, j2] = geoJitter(l.id || addr);
    return [cache[addr][0] + j1, cache[addr][1] + j2];
  }
  return null;
}

// Optional best-effort runtime geocode for unknown addresses. Never blocks render;
// caches the result and re-renders the map if still visible.
function backfillUnknownLocations(unknownLeads) {
  if (!Array.isArray(unknownLeads) || !unknownLeads.length) return;
  const cache = loadGeoCache();
  // Only attempt addresses we have text for and haven't cached/failed before.
  const todo = [];
  const seen = new Set();
  for (const l of unknownLeads) {
    const addr = (typeof l.address === 'string') ? l.address.trim() : '';
    if (!addr) continue;
    const key = addr.toLowerCase();
    if (cache[key] !== undefined || seen.has(key)) continue;
    seen.add(key);
    todo.push(key);
  }
  if (!todo.length) return;
  // Throttle: one lookup per render cycle to respect Nominatim usage policy.
  const key = todo[0];
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q=' + encodeURIComponent(key))
    .then(r => r.ok ? r.json() : [])
    .then(arr => {
      const c = loadGeoCache();
      if (Array.isArray(arr) && arr.length && arr[0].lat && arr[0].lon) {
        c[key] = [Number(arr[0].lat), Number(arr[0].lon)];
      } else {
        c[key] = null; // mark as attempted to avoid re-querying
      }
      saveGeoCache(c);
      if (state.activeSection === 'map') renderMap();
    })
    .catch(() => {});
}

  container.innerHTML = `

    <p style="color:var(--color-text-muted);font-size:var(--text-sm);margin-bottom:var(--space-4);">

      ${legendHtml || '<span style="color:var(--color-text-muted);">No located leads.</span>'}
      <span style="color:var(--color-text-muted);">${located.length} mapped · ${undisclosed.length} location undisclosed</span>
    </div>
    <div style="display:flex;gap:var(--space-4);flex-wrap:wrap;align-items:stretch;">
      <div style="flex:1 1 480px;min-width:280px;">

          ? `<div id="crescendo-leaflet-map" style="height:560px;border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;z-index:0;"></div>`
          : `<div style="height:560px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;border:1px dashed var(--color-border);border-radius:var(--radius-md);color:var(--color-text-muted);">Map library unavailable (offline?). Lead counts above still reflect the data.</div>`}

  if (!leafletReady) return;

  const mapEl = document.getElementById('crescendo-leaflet-map');
  if (!mapEl) return;

  const map = window.L.map(mapEl, { scrollWheelZoom: true });
  __crescendoMap = map;
  window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const markers = [];
  located.forEach(({ lead, pt }) => {
    const color = leadStatusColor(lead.status);
    const m = window.L.circleMarker(pt, {
      radius: 7, color: '#fff', weight: 1.5, fillColor: color, fillOpacity: 0.85
    });
    const name = escapeHtml(lead.businessName || 'Unnamed lead');
    const statusLabel = escapeHtml(leadStatusLabel(lead.status));
    const assigned = lead.assignedTo ? escapeHtml(lead.assignedTo) : 'Unclaimed';
    const claim = (lead.claimedBy && lead.claimedBy !== lead.assignedTo)
      ? '<br>Last claimed by ' + escapeHtml(lead.claimedBy) : '';
    m.bindPopup(`<strong>${name}</strong><br>Status: ${statusLabel}<br>Assigned: ${assigned}${claim}`);
    m.on('click', () => { try { openPanel('view-lead', getLeadById(lead.id)); } catch (_) {} });
    m.addTo(map);
    markers.push(m);
  });

  if (markers.length) {
    const group = window.L.featureGroup(markers);
    try { map.fitBounds(group.getBounds().pad(0.2)); }
    catch (e) { map.setView([54.0, -2.5], 6); }
  } else {
    map.setView([54.0, -2.5], 5); // default: UK overview
  }

  // Leaflet needs a size recalculation once the (previously hidden) container is laid out.
  setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 60);

  // Best-effort runtime geocoding for unknown addresses (non-blocking).
  try { backfillUnknownLocations(undisclosed); } catch (_) {}
}

// ========== SIDEBAR BADGES ==========
function renderSidebarBadges() {
  const leadBankCount = state.leads.filter(l => l.status !== 'archive').length;
  // Waiting-to-be-moved only, so the badge visibly drops the moment a lead goes to the CRM.
  const qualCount = state.leads.filter(l => l.status === 'qualified').length;
  const crmCount = state.leads.filter(l => l.status === 'crm').length;
  const meetCount = state.leads.filter(l => l.status === 'crm' && l.crm && l.crm.meetingBooked).length;
  const archCount = state.leads.filter(l => l.status === 'archive').length;

  const overdueInCRM = state.leads.filter(l => l.status === 'crm' && l.crm && l.crm.followUpDate && daysUntil(l.crm.followUpDate) !== null && daysUntil(l.crm.followUpDate) <= 0).length;

  document.getElementById('badge-lead-bank').textContent = leadBankCount;
  document.getElementById('badge-qualified').textContent = qualCount;

  const crmBadge = document.getElementById('badge-crm');
  if (overdueInCRM > 0) {
    crmBadge.textContent = crmCount;
    crmBadge.className = 'nav-badge nav-badge-warning';
    crmBadge.title = overdueInCRM + ' overdue follow-up' + (overdueInCRM !== 1 ? 's' : '');
  } else {
    crmBadge.textContent = crmCount;
    crmBadge.className = 'nav-badge nav-badge-teal';
    crmBadge.title = crmCount + ' lead' + (crmCount !== 1 ? 's' : '') + ' in CRM';
  }
  document.getElementById('badge-meetings').textContent = meetCount;
  document.getElementById('badge-archive').textContent = archCount;

  // Phone bottom-nav badges: only show what's actionable (overdue follow-ups, today's meetings).
  const meetingsToday = state.leads.filter(l => l.status === 'crm' && l.crm && l.crm.meetingBooked && l.crm.meetingDate && isTodayISO(l.crm.meetingDate)).length;
  const setBnav = (id, n, warn) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (n > 0) { el.textContent = n > 99 ? '99+' : String(n); el.hidden = false; el.classList.toggle('warn', !!warn); }
    else el.hidden = true;
  };
  setBnav('bnav-badge-crm', overdueInCRM, true);
  setBnav('bnav-badge-meetings', meetingsToday, false);
  setBnav('bnav-badge-lead-bank', 0, false);
}

// ========== PANEL & MODAL ==========
function openPanel(type, data) {
  state.panelOpen = true;
  state.panelTrigger = document.activeElement;
  const panel = document.getElementById('side-panel');
  const overlay = document.getElementById('panel-overlay');
  const content = document.getElementById('panel-content');

  if (type === 'add-lead') {
    content.innerHTML = renderAddLeadForm();
  } else if (type === 'view-lead') {
    content.innerHTML = renderViewLeadPanel(data);
  } else if (type === 'view-qualification') {
    content.innerHTML = renderViewQualificationPanel(data);
  }

  panel.classList.add('active');
  overlay.classList.add('active');
  overlay.setAttribute('aria-hidden', 'false');
  lucide.createIcons({ nodes: [content] });

  // Focus first focusable
  setTimeout(() => {
    const first = panel.querySelector('input, textarea, select, button');
    if (first) first.focus();
  }, 260);
}
function closePanel() {
  state.panelOpen = false;
  document.getElementById('side-panel').classList.remove('active');
  document.getElementById('panel-overlay').classList.remove('active');
  document.getElementById('panel-overlay').setAttribute('aria-hidden', 'true');
  if (state.panelTrigger) {
    state.panelTrigger.focus();
    state.panelTrigger = null;
  }
}
function openModal(type, data) {
  state.modalOpen = true;

// ========== RENDER: HOME / DASHBOARD ==========
function renderHome() {
  const container = document.getElementById('home-content');
  if (!container) return;
  const user = getCurrentUser();
  const firstName = (user || 'there').split(' ')[0];
  const now = new Date();
  const hour = now.getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dateLine = `${dayNames[now.getDay()]}, ${now.getDate()} ${monthNames[now.getMonth()]} ${now.getFullYear()}`;

  const isAggregate = isMasterUser() || CEOS.includes(user);
  const myLeads = isAggregate ? state.leads : state.leads.filter(l => l.assignedTo === user);

  // Pipeline for my leads
  const myPipeline = computePipeline(myLeads);

  // Meetings this week
  const startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - now.getDay());
  startOfWeek.setHours(0,0,0,0);
  const endOfWeek = new Date(startOfWeek);
  endOfWeek.setDate(startOfWeek.getDate() + 7);
  const meetingsThisWeek = myLeads.filter(l => {
    if (!l.crm || !l.crm.meetingBooked || !l.crm.meetingDate) return false;
    const md = new Date(l.crm.meetingDate);
    return md >= startOfWeek && md < endOfWeek;
  });

  // Follow-ups due today (and overdue)
  const followUpsToday = myLeads.filter(l => l.crm && l.crm.followUpDate && daysUntil(l.crm.followUpDate) === 0);
  const overdueFollowUps = myLeads.filter(l => l.crm && l.crm.followUpDate && daysUntil(l.crm.followUpDate) !== null && daysUntil(l.crm.followUpDate) < 0);
  const meetingsToday = myLeads.filter(l => l.crm && l.crm.meetingBooked && l.crm.meetingDate && isTodayISO(l.crm.meetingDate));

  // Leads touched in the last 48 hours. The old label said "New responses", which this has
  // never measured — there is no inbound channel, and the count included the rep's own calls.
  const twoDaysAgo = Date.now() - 2 * 86400000;
  const newResponses = myLeads.filter(l => (l.activity || []).some(a => new Date(a.date).getTime() >= twoDaysAgo));

  // Top 3 opportunity score leads not yet contacted
  const topOpps = [...myLeads]
    .filter(l => l.status === 'crm' && l.crm && !l.crm.dateFirstContact && getOpportunityScore(l) >= 70)
    .sort((a, b) => getOpportunityScore(b) - getOpportunityScore(a))
    .slice(0, 3);

  const priorities = [];
  // Meetings first, then the most overdue, then today's. Overdue used to be capped at 5, so a
  // rep with 40 of them saw five and nothing told them the other 35 existed.
  overdueFollowUps
    .slice()
    .sort((a, b) => daysUntil(a.crm.followUpDate) - daysUntil(b.crm.followUpDate))
    .forEach(l => priorities.push({ type: 'overdue', lead: l, label: 'Overdue follow-up', meta: `${Math.abs(daysUntil(l.crm.followUpDate))} days overdue` }));
  followUpsToday.forEach(l => priorities.push({ type: 'today', lead: l, label: 'Follow-up today', meta: 'Due today' }));
  meetingsToday.forEach(l => priorities.push({ type: 'today', lead: l, label: 'Meeting today', meta: formatDateTime(l.crm.meetingDate) }));
  topOpps.forEach(l => priorities.push({ type: 'opportunity', lead: l, label: 'High-score opportunity', meta: `Score ${getOpportunityScore(l)} &middot; not contacted` }));

  // Recent activity relevant to user
  const recentActivity = [];
  myLeads.forEach(l => {
    (l.activity || []).forEach(a => {
      if (isAggregate || a.by === user || l.assignedTo === user) {
        recentActivity.push({ ...a, leadName: l.businessName, leadId: l.id });
      }
    });
  });
  recentActivity.sort((a, b) => new Date(b.date) - new Date(a.date));
  const recent = recentActivity.slice(0, 5);

  const pipelineLabel = isAggregate ? 'Team pipeline' : 'Your pipeline';
  const meetingsLabel = isAggregate ? 'Team meetings this week' : 'Meetings this week';
  const followUpLabel = isAggregate ? 'Team follow-ups due' : 'Follow-ups due today';
  const respLabel = isAggregate ? 'Team worked (48h)' : 'Leads worked (48h)';

  const html = `
    <div class="home-greeting">
      <h1>${greet}, ${escapeHtml(firstName)}.</h1>
      <p>It's ${dateLine}.</p>
    </div>
    <div class="home-stats">
      <div class="home-stat-card accent">
        <div class="stat-label">${pipelineLabel}</div>
        <div class="stat-value">${formatMoney(myPipeline.total)}</div>
      </div>
      <div class="home-stat-card">
        <div class="stat-label">${meetingsLabel}</div>
        <div class="stat-value">${meetingsThisWeek.length}</div>
      </div>
      <div class="home-stat-card">
        <div class="stat-label">${followUpLabel}</div>
        <div class="stat-value">${followUpsToday.length + overdueFollowUps.length}</div>
      </div>
      <div class="home-stat-card">
        <div class="stat-label">${respLabel}</div>
        <div class="stat-value">${newResponses.length}</div>
      </div>
    </div>
    <div class="home-columns">
      <div>
        <h2 class="home-section-title">Today's priorities</h2>
        ${priorities.length === 0 ? `<div class="priority-item"><div><div class="pi-title">Inbox zero</div><div class="pi-meta">No overdue items, no meetings today, no urgent follow-ups.</div></div></div>` : `
        <div class="priority-list">
          ${priorities.slice(0, 25).map(p => `
            <div class="priority-item ${p.type}" data-action="home-goto-lead" data-id="${p.lead.id}" role="button" tabindex="0">
              <div>
                <div class="pi-title">${escapeHtml(p.lead.businessName)} &middot; ${p.label}</div>
                <div class="pi-meta">${p.meta}</div>
              </div>
              <div class="pi-spacer"></div>
              <button class="btn btn-primary btn-sm" data-action="home-contact-lead" data-id="${p.lead.id}">${p.type === 'today' && p.label === 'Meeting today' ? 'Open' : 'Contact Now'}</button>
            </div>
          `).join('')}
          ${priorities.length > 25 ? `<div class="priority-more">${priorities.length - 25} more waiting. <button class="btn btn-ghost btn-sm" data-action="home-open-followups">Work them in Outreach</button></div>` : ''}
        </div>`}
      </div>
      <div>
        <h2 class="home-section-title">Recent activity</h2>
        ${recent.length === 0 ? `<div class="recent-activity-item">No recent activity yet.</div>` : `
        <div class="recent-activity-feed">
          ${recent.map(a => `
            <div class="recent-activity-item">
              <div><strong>${escapeHtml(a.by)}</strong> ${escapeHtml(a.action)} &middot; ${escapeHtml(a.leadName)}</div>
              <div class="ra-meta">${formatTimeAgo(a.date)}</div>
            </div>
          `).join('')}
        </div>`}
      </div>
    </div>
  `;
  container.innerHTML = html;
  lucide.createIcons({ nodes: [container] });
}

// Split into toolbar (renderLeadBank) + list (renderLeadBankList) so typing in the search
// box only re-renders the list — re-rendering the whole section destroyed the input and
// dropped keyboard focus on every keystroke.
function getFilteredLeadBank() {
  const f = state.filters.leadBank;
  let leads = state.leads.filter(l => l.status !== 'archive');
  const totalCount = leads.length;

  if (f.search) {
    const s = f.search.toLowerCase();
    leads = leads.filter(l =>
      l.businessName.toLowerCase().includes(s) ||
      l.description.toLowerCase().includes(s) ||
      l.contacts.some(c => c.name.toLowerCase().includes(s))
    );
  }
  if (f.status !== 'all') leads = leads.filter(l => l.status === f.status);
  if (f.source !== 'all') leads = leads.filter(l => l.source === f.source);
  if (f.assignedTo !== 'all') leads = leads.filter(l => l.assignedTo === f.assignedTo);
  if (f.today) leads = leads.filter(l => isTodayLead(l));

  const lbSort = f.sort || 'date';
  if (lbSort === 'score') leads.sort((a, b) => getOpportunityScore(b) - getOpportunityScore(a));
  else if (lbSort === 'name') leads.sort((a, b) => a.businessName.localeCompare(b.businessName));

  return { leads, totalCount };
}

// ========== RENDER: QUALIFIED LEADS ==========
// Distinct values present in a set of leads, for filter dropdowns. Only ever offers options
// that will actually match something, so a rep can't filter their way to an empty screen.
function distinctValues(leads, fn) {
  const set = new Set();
  for (const l of leads) { const v = fn(l); if (v) set.add(v); }
  return Array.from(set).sort((a, b) => a.localeCompare(b));
}
function getFilteredQualified() {
  const f = state.filters.qualified;
  let leads = state.leads.filter(l => l.status === 'qualified');
  const totalCount = leads.length;
  if (f.search) {
    const s = f.search.toLowerCase();
    leads = leads.filter(l =>
      l.businessName.toLowerCase().includes(s) ||
      (l.description || '').toLowerCase().includes(s) ||
      (l.contacts || []).some(c => c.name.toLowerCase().includes(s))
    );
  }
  if (f.industry !== 'all') leads = leads.filter(l => (l.industry || '') === f.industry);
  if (f.city !== 'all') leads = leads.filter(l => leadCity(l) === f.city);
  if (f.source !== 'all') leads = leads.filter(l => l.source === f.source);
  if (f.assignedTo !== 'all') leads = leads.filter(l => l.assignedTo === f.assignedTo);
  if (f.hasPhone) leads = leads.filter(l => leadHasPhone(l));

  const sort = f.sort || 'score';
  if (sort === 'score') leads.sort((a, b) => getOpportunityScore(b) - getOpportunityScore(a));
  else if (sort === 'name') leads.sort((a, b) => a.businessName.localeCompare(b.businessName));
  else if (sort === 'date') leads.sort((a, b) => String((b.qualification && b.qualification.dateQualified) || b.dateAdded || '').localeCompare(String((a.qualification && a.qualification.dateQualified) || a.dateAdded || '')));
  return { leads, totalCount };
}
function renderQualifiedLeads() {
  const container = document.getElementById('qualified-leads-content');

  // the CRM stayed sitting in this grid and the sidebar count never dropped — pressing

  // still waiting to be moved; once moved, the lead lives in CRM / Outreach.
  const f = state.filters.qualified;
  const all = state.leads.filter(l => l.status === 'qualified');
  const unqualified = state.leads.filter(l => l.status === 'unqualified');

    <div class="section-header">

      <select class="form-select" data-filter="ql-industry" aria-label="Filter by industry">
        <option value="all"${f.industry==='all'?' selected':''}>All Industries</option>

      </select>
      <select class="form-select" data-filter="ql-source" aria-label="Filter by source">
        <option value="all"${f.source==='all'?' selected':''}>All Sources</option>
        ${SOURCES.map(s => `<option value="${s}"${f.source===s?' selected':''}>${sourceLabel(s)}</option>`).join('')}
      </select>
      <select class="form-select" data-filter="ql-assigned" aria-label="Filter by assigned consultant">
        <option value="all"${f.assignedTo==='all'?' selected':''}>All Sales</option>
        ${ownerOptions(f.assignedTo === 'all' ? '' : f.assignedTo).map(c => `<option value="${escapeHtml(c)}"${f.assignedTo===c?' selected':''}>${escapeHtml(c)}</option>`).join('')}
      </select>
      <button class="today-chip${f.hasPhone ? ' active' : ''}" data-action="toggle-qual-phone" aria-pressed="${!!f.hasPhone}"><i data-lucide="phone" aria-hidden="true"></i> Has phone</button>
      <select class="form-select" data-filter="ql-sort" aria-label="Sort qualified leads">
        <option value="score"${(f.sort||'score')==='score'?' selected':''}>Sort by Score</option>
        <option value="date"${f.sort==='date'?' selected':''}>Sort by Date Qualified</option>
        <option value="name"${f.sort==='name'?' selected':''}>Sort by Name</option>
      </select>
      <span class="count-label" id="ql-count"></span>
    </div>
    <div class="qual-bulk-row">
      <button class="btn btn-ghost btn-sm" data-action="qual-select-all"><i data-lucide="check-square" aria-hidden="true"></i> Select all shown</button>
    </div>
    <div class="bulk-bar${(state.bulkScope === 'qualified' && state.bulkSelection && state.bulkSelection.length) ? ' active' : ''}" id="bulk-bar-qualified">
      <span class="bulk-count">${(state.bulkSelection || []).length} selected</span>
      <select class="form-select bulk-action-select" data-action="bulk-action" data-scope="qualified" aria-label="Bulk action">
        <option value="">Choose action...</option>
        <option value="move-to-crm">Move to CRM / Outreach</option>
        ${canReassignLeads() ? '<optgroup label="Reassign to">' + SALES_TEAM.map(c => `<option value="reassign:${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('') + '</optgroup>' : ''}
        <option value="archive">Archive</option>

      <button class="btn btn-ghost btn-sm" data-action="bulk-clear">Clear selection</button>
    </div>
  `;

  html += `<div class="qual-layout${hasUnqual ? '' : ' full-width'}">`;

  // Unqualified sidebar
  if (hasUnqual) {
    html += `

          </div>
        `).join('')}

  html += '</div>';

  container.innerHTML = html;

// Split out so typing in the search box only re-renders the grid and never destroys the
// focused input (same pattern as the Lead Bank and CRM toolbars).
function renderQualifiedList() {
  const listEl = document.getElementById('qualified-list');
  if (!listEl) return;
  const { leads: qualified, totalCount } = getFilteredQualified();
  const countEl = document.getElementById('ql-count');
  if (countEl) countEl.textContent = `Showing ${qualified.length} of ${totalCount}`;

  let html = '';
  if (qualified.length === 0) {
    html += `
      <div class="empty-state">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="60" cy="60" r="40" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M45 60 L55 70 L75 50" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h3>${totalCount === 0 ? 'No qualified leads yet' : 'Nothing matches these filters'}</h3>
        <p>${totalCount === 0 ? 'Qualify leads from the Lead Bank to see them here.' : 'There are ' + totalCount + ' qualified leads. Widen the filters above to see them.'}</p>
      </div>
    `;
  } else {
    const limit = state.qualLimit || QUAL_PAGE;
    const visible = qualified.slice(0, limit);
    html += '<div class="lead-grid">';
    visible.forEach(l => {
      const q = l.qualification || {};
      const sb = statusBadgeFor(l.status);
      const city = leadCity(l);
      const phone = (l.phones && l.phones[0] && l.phones[0].number) || ((l.contacts || []).find(c => c && c.phone) || {}).phone || '';
      const selected = (state.bulkSelection || []).includes(l.id);
      html += `
        <div class="card lead-card${selected ? ' selected' : ''}">
          <div class="lead-card-header">
            <div>
              <div class="lead-card-name"><input type="checkbox" class="bulk-check" data-action="bulk-toggle" data-scope="qualified" data-id="${l.id}" ${selected ? 'checked' : ''} aria-label="Select ${escapeHtml(l.businessName)}"> ${escapeHtml(l.businessName)}</div>
              ${l.industry ? `<span class="badge badge-neutral">${escapeHtml(l.industry)}</span>` : ''}
              ${city ? `<span class="badge badge-neutral">${escapeHtml(city)}</span>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:var(--space-2);">
              ${renderScoreBadge(l)}
              <span class="badge ${sb.cls}">${sb.label}</span>
            </div>
          </div>
          <div class="service-tags">
            <span class="service-tag ${q.strategyDesign?.trim() ? 'filled' : 'empty'}">Strategy & Design ${q.strategyDesign?.trim() ? '&#10003;' : ''}</span>
            <span class="service-tag ${q.experienceDesign?.trim() ? 'filled' : 'empty'}">Experience Design ${q.experienceDesign?.trim() ? '&#10003;' : ''}</span>
            <span class="service-tag ${q.digitalCommerce?.trim() ? 'filled' : 'empty'}">Digital Commerce ${q.digitalCommerce?.trim() ? '&#10003;' : ''}</span>
          </div>
          ${q.growthIntent ? `<p class="lead-card-desc" style="-webkit-line-clamp:1;">${escapeHtml(q.growthIntent)}</p>` : ''}
          <div class="lead-card-meta">
            <span>${formatDate(q.dateQualified || l.dateAdded)}</span>
            ${phone ? `<a class="lead-card-phone" href="tel:${escapeHtml(String(phone).replace(/[^+0-9]/g,''))}"><i data-lucide="phone" aria-hidden="true"></i> ${escapeHtml(phone)}</a>` : '<span class="lead-card-nophone">No phone</span>'}
          </div>
          ${renderAttribution(l)}
          ${renderClaimBadge(l)}
          ${renderLastActivity(l)}
          <div class="lead-card-actions">
            ${(l.phones && l.phones.length) ? `<button class="btn btn-sm" style="background:var(--color-primary);color:white" data-action="call-lead" data-id="${l.id}"><i data-lucide="phone" aria-hidden="true"></i> Call</button>` : ''}
            <button class="btn btn-ghost btn-sm" data-action="view-qual" data-id="${l.id}"><i data-lucide="eye" aria-hidden="true"></i> View Full</button>
            ${l.status === 'qualified' ? `<button class="btn btn-primary btn-sm" data-action="move-to-crm" data-id="${l.id}"><i data-lucide="arrow-right" aria-hidden="true"></i> Move to CRM</button>` : ''}
          </div>
        </div>
      `;
    });
    html += '</div>';
    if (qualified.length > limit) html += renderShowMore('qualified', qualified.length - limit);
  }

  listEl.innerHTML = html;
  lucide.createIcons({ nodes: [listEl] });
}

// Split into toolbar (renderCRM) + list (renderCRMListView) so search keystrokes only
// re-render the list and never destroy the focused input.
// Which follow-up bucket a lead sits in: 'overdue' | 'today' | 'week' | 'later' | 'none'.
function followUpBucket(l) {
  if (!l || !l.crm || !l.crm.followUpDate) return 'none';
  const d = daysUntil(l.crm.followUpDate);
  if (d === null) return 'none';
  if (d < 0) return 'overdue';
  if (d === 0) return 'today';
  if (d <= 7) return 'week';
  return 'later';
}
// Counts behind the follow-up strip in Outreach. Reps asked to see what is owed to them here
// rather than having to go back to Home for it.
function followUpCounts(leads) {
  const c = { overdue: 0, today: 0, week: 0, later: 0, none: 0 };
  for (const l of leads) c[followUpBucket(l)]++;
  return c;
}
function getFilteredCRM() {
  const f = state.filters.crm;
  let leads = state.leads.filter(l => l.status === 'crm');
  if (f.assignedTo !== 'all') leads = leads.filter(l => l.assignedTo === f.assignedTo);
  // Cohort = everything this rep is looking at before the narrowing filters. The follow-up
  // strip counts against this, so its numbers don't collapse the moment you click one of them.
  const cohort = leads.slice();
  const totalCount = leads.length;

  if (f.search) {
    const s = f.search.toLowerCase();
    leads = leads.filter(l =>
      l.businessName.toLowerCase().includes(s) ||
      l.contacts.some(c => c.name.toLowerCase().includes(s))
    );
  }
  if (f.stage !== 'all') leads = leads.filter(l => l.crm && l.crm.stage === parseInt(f.stage));
  if (f.priority !== 'all') leads = leads.filter(l => l.crm && l.crm.priority === f.priority);
  if (f.overdueOnly) leads = leads.filter(l => l.crm && l.crm.followUpDate && daysUntil(l.crm.followUpDate) !== null && daysUntil(l.crm.followUpDate) <= 0);
  if (f.today) leads = leads.filter(l => isTodayLead(l));
  if (f.touchedToday) leads = leads.filter(l => isTouchedToday(l));
  if (f.stalled) leads = leads.filter(l => isStalled(l));
  if (f.followUp && f.followUp !== 'all') leads = leads.filter(l => followUpBucket(l) === f.followUp);

  const crmSort = f.sort || 'score';
  if (crmSort === 'score') leads.sort((a, b) => getOpportunityScore(b) - getOpportunityScore(a));
  else if (crmSort === 'name') leads.sort((a, b) => a.businessName.localeCompare(b.businessName));
  // "Sort by Date" was in the dropdown but did nothing, so a lead you had just moved in stayed
  // buried wherever its score put it — part of why moved leads felt lost. Newest movement first.
  else if (crmSort === 'date') leads.sort((a, b) => String(crmTouchedOn(b)).localeCompare(String(crmTouchedOn(a))));

  return { leads, totalCount, cohort };
}
// Best available "when did this lead last move" date, for date sorting and the card sub-line.
function crmTouchedOn(l) {
  if (!l || !l.crm) return '';
  const acts = l.activity && l.activity[0] && l.activity[0].date ? String(l.activity[0].date).split('T')[0] : '';
  return [acts, stageChangedOn(l), l.crm.dateLastContact || '', l.crm.dateMovedToCRM || ''].sort().pop() || '';
}
// Which narrowing filters are on. Shown as a clearable banner so a lead that has simply been
// filtered out of view never reads as a lead that failed to move.
function activeCRMFilters() {
  const f = state.filters.crm;
  const on = [];
  if (f.search) on.push({ key: 'search', label: 'Search "' + f.search + '"' });
  if (f.stage !== 'all') on.push({ key: 'stage', label: getStageName(parseInt(f.stage)) });
  if (f.priority !== 'all') on.push({ key: 'priority', label: f.priority + ' priority' });
  if (f.overdueOnly) on.push({ key: 'overdue', label: 'Overdue only' });
  if (f.today) on.push({ key: 'today', label: 'Due today' });
  if (f.touchedToday) on.push({ key: 'touchedToday', label: 'Worked today' });
  if (f.stalled) on.push({ key: 'stalled', label: 'Stalled' });
  if (f.followUp && f.followUp !== 'all') on.push({ key: 'followUp', label: FOLLOW_UP_LABELS[f.followUp] || f.followUp });
  if (f.assignedTo !== 'all') on.push({ key: 'assigned', label: f.assignedTo });
  return on;
}
const FOLLOW_UP_LABELS = { overdue: 'Overdue', today: 'Due today', week: 'Next 7 days', later: 'Later', none: 'No follow-up set' };
function clearCRMFilters() {
  const f = state.filters.crm;
  f.search = ''; f.stage = 'all'; f.priority = 'all'; f.overdueOnly = false;
  f.today = false; f.touchedToday = false; f.stalled = false; f.followUp = 'all'; f.assignedTo = 'all';
  savePrefs();
  state.crmLimit = CRM_PAGE;
}

  const pipe = computePipeline(pipeLeads);
  const cohort = f.assignedTo === 'all' ? pipeLeads : pipeLeads.filter(l => l.assignedTo === f.assignedTo);
  const fu = followUpCounts(cohort);
  const workedToday = cohort.filter(isTouchedToday).length;
  const activeFilters = activeCRMFilters();
  const dueNow = dueQueue().length;
  const stalledCount = cohort.filter(isStalled).length;

  container.innerHTML = `
    <div class="section-header">
      <h1>CRM / Outreach</h1>
      <div class="view-toggle">

        <button class="view-toggle-btn ${state.crmView === 'board' ? 'active' : ''}" data-action="crm-view" data-view="board" aria-label="Board view"><i data-lucide="columns-3" aria-hidden="true"></i> Board</button>

    </div>
    <div class="pipeline-bar">

      <div class="pipeline-stat"><span class="pipeline-stat-value">${formatMoney(pipe.closed)}</span><span class="pipeline-stat-label">closed</span></div>

    </div>
    <div class="followup-strip" role="group" aria-label="Follow-ups">

      ${dueNow ? `<button class="btn btn-primary btn-sm work-list-btn" data-action="start-work-list"><i data-lucide="play" aria-hidden="true"></i> Work the list (${dueNow})</button>` : ''}
      <button class="fu-chip fu-overdue${f.followUp==='overdue'?' active':''}" data-action="follow-up-filter" data-bucket="overdue" aria-pressed="${f.followUp==='overdue'}"><strong>${fu.overdue}</strong> overdue</button>
      <button class="fu-chip fu-today${f.followUp==='today'?' active':''}" data-action="follow-up-filter" data-bucket="today" aria-pressed="${f.followUp==='today'}"><strong>${fu.today}</strong> due today</button>
      <button class="fu-chip${f.followUp==='week'?' active':''}" data-action="follow-up-filter" data-bucket="week" aria-pressed="${f.followUp==='week'}"><strong>${fu.week}</strong> next 7 days</button>
      <button class="fu-chip${f.followUp==='later'?' active':''}" data-action="follow-up-filter" data-bucket="later" aria-pressed="${f.followUp==='later'}"><strong>${fu.later}</strong> later</button>
      <button class="fu-chip fu-none${f.followUp==='none'?' active':''}" data-action="follow-up-filter" data-bucket="none" aria-pressed="${f.followUp==='none'}"><strong>${fu.none}</strong> no date set</button>
      <span class="followup-strip-sep"></span>
      <button class="fu-chip fu-worked${f.touchedToday?' active':''}" data-action="toggle-worked-today" aria-pressed="${!!f.touchedToday}"><strong>${workedToday}</strong> worked today</button>
      ${stalledCount || f.stalled ? `<button class="fu-chip fu-stalled${f.stalled?' active':''}" data-action="toggle-stalled" aria-pressed="${!!f.stalled}" title="No movement for ${STALL_DAYS}+ days"><strong>${stalledCount}</strong> stalled</button>` : ''}
    </div>
    ${activeFilters.length ? `
      <div class="filter-notice">
        <i data-lucide="filter" aria-hidden="true"></i>
        <span>Filtered by ${activeFilters.map(x => escapeHtml(x.label)).join(' &middot; ')}. Leads outside this are hidden, not missing.</span>
        <button class="btn btn-ghost btn-sm" data-action="clear-crm-filters">Clear filters</button>
      </div>
    ` : ''}
    <div class="filter-bar">
      <input type="text" class="form-input" placeholder="Search by name or contact..." value="${escapeHtml(f.search)}" data-filter="crm-search" aria-label="Search CRM">
      <select class="form-select" data-filter="crm-stage" aria-label="Filter by stage">
        <option value="all"${f.stage==='all'?' selected':''}>All Stages</option>

    </div>
    <div class="bulk-bar${(state.bulkSelection && state.bulkSelection.length) ? ' active' : ''}" id="bulk-bar-crm">
      <span class="bulk-count">${(state.bulkSelection || []).length} selected</span>
      <select class="form-select bulk-action-select" data-action="bulk-action" data-scope="crm" aria-label="Bulk action">
        <option value="">Choose action...</option>
        ${canReassignLeads() ? '<optgroup label="Reassign to">' + SALES_TEAM.map(c => `<option value="reassign:${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('') + '</optgroup>' : ''}
        <optgroup label="Move to stage">${STAGES.map(s => `<option value="stage:${s.num}">${s.name}</option>`).join('')}</optgroup>
        <option value="archive">Archive</option>
        <option value="delete">Delete</option>
      </select>
      <button class="btn btn-ghost btn-sm" data-action="bulk-clear">Clear selection</button>
    </div>
    <div id="crm-list"></div>
    <div id="crm-sheet"></div>
  `;
  lucide.createIcons({ nodes: [container] });
  renderCRMListView();
}

function renderCRMListView() {
  const listEl = document.getElementById('crm-list');
  if (!listEl) return;
  const { leads, totalCount } = getFilteredCRM();
  const countEl = document.getElementById('crm-count');
  if (countEl) countEl.textContent = `Showing ${leads.length} of ${totalCount}`;

  if (state.crmView === 'list') {
    listEl.innerHTML = renderCRMList(leads);
  } else {
    listEl.innerHTML = renderCRMBoard(leads);
  }
  lucide.createIcons({ nodes: [listEl] });
  if (state.crmView === 'board') initKanbanDrag();
  renderCRMSheet(leads);
}

// Full record for one lead, opened by tapping a board card. It lives INSIDE #section-crm on
// purpose: every control in it is the same markup as the list view, so the section's existing
// delegated handlers drive it with no duplicate wiring. Prev/Next walk the leads currently on
// screen, in the same order, so a rep can work a column one lead at a time.
function renderCRMSheet(leads) {
  const host = document.getElementById('crm-sheet');
  if (!host) return;
  const id = state.crmSheetId;
  if (!id) { host.innerHTML = ''; return; }
  const lead = getLeadById(id);
  if (!lead || lead.status !== 'crm') { state.crmSheetId = null; host.innerHTML = ''; return; }
  // In work-the-list mode the queue is the frozen due list, not whatever the filters currently
  // show — otherwise logging a call would drop the lead out and renumber everything mid-run.
  const working = Array.isArray(state.workList) && state.workList.length > 0;
  const order = working ? state.workList : (leads || []).map(l => l.id);
  const idx = order.indexOf(id);
  const pos = idx >= 0 ? `${idx + 1} of ${order.length}` : '';
  const pc = getPrimaryContact(lead);
  const phones = (lead.phones || []).map(p => p && p.number).filter(Boolean);
  if (pc && pc.phone && !phones.includes(pc.phone)) phones.push(pc.phone);
  const emails = (lead.emails || []).map(e => e && e.address).filter(Boolean);
  if (pc && pc.email && !emails.includes(pc.email)) emails.push(pc.email);
  // Details always open in the sheet — the whole point of opening it is to see them.
  state.crmDetailsOpen[id] = true;
  host.innerHTML = `
    <div class="crm-sheet-overlay" data-action="close-crm-sheet"></div>
    <div class="crm-sheet" role="dialog" aria-modal="true" aria-label="${escapeHtml(lead.businessName)}">
      <div class="crm-sheet-bar${working ? ' working' : ''}">
        <button class="crm-sheet-nav" data-action="crm-sheet-nav" data-dir="-1" ${idx <= 0 ? 'disabled' : ''} aria-label="Previous lead"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
        <span class="crm-sheet-pos">${working ? 'Working ' : ''}${pos}</span>
        <button class="crm-sheet-nav" data-action="crm-sheet-nav" data-dir="1" ${idx < 0 || idx >= order.length - 1 ? 'disabled' : ''} aria-label="Next lead"><i data-lucide="chevron-right" aria-hidden="true"></i></button>
        ${working ? (idx >= order.length - 1
          // Last lead in the run: the only way out was the X, which read as abandoning it.
          ? `<button class="btn btn-primary btn-sm crm-sheet-skip" data-action="finish-work-list">Finish</button>`
          : `<button class="btn btn-secondary btn-sm crm-sheet-skip" data-action="crm-sheet-nav" data-dir="1">Skip</button>`) : ''}
        <button class="crm-sheet-close" data-action="close-crm-sheet" aria-label="${working ? 'Finish list' : 'Close'}"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>
      <div class="crm-sheet-body">
        <div class="crm-sheet-contact">
          ${pc ? `<div class="crm-sheet-person">${escapeHtml(pc.name)}${pc.title ? ' &middot; ' + escapeHtml(pc.title) : ''}</div>` : ''}
          ${lead.address ? `<div class="crm-sheet-line"><i data-lucide="map-pin" aria-hidden="true"></i> ${escapeHtml(lead.address)}</div>` : ''}
          ${phones.length ? phones.map(p => `<div class="crm-sheet-line"><i data-lucide="phone" aria-hidden="true"></i> <a href="tel:${escapeHtml(String(p).replace(/[^+0-9]/g,''))}">${escapeHtml(p)}</a></div>`).join('') : '<div class="crm-sheet-line crm-sheet-muted">No phone on file</div>'}
          ${emails.map(em => `<div class="crm-sheet-line"><i data-lucide="mail" aria-hidden="true"></i> <a href="mailto:${escapeHtml(em)}">${escapeHtml(em)}</a></div>`).join('')}
          ${lead.website ? `<div class="crm-sheet-line"><i data-lucide="globe" aria-hidden="true"></i> <a href="${escapeHtml(lead.website)}" target="_blank" rel="noopener">${escapeHtml(lead.website)}</a></div>` : ''}
        </div>
        ${renderCRMList([lead])}
      </div>
    </div>
  `;
  lucide.createIcons({ nodes: [host] });
}
function openCRMSheet(id) {
  state.crmSheetId = id;
  renderCRMListView();
}
function closeCRMSheet() {
  if (!state.crmSheetId) return;
  state.crmDetailsOpen[state.crmSheetId] = false;
  state.crmSheetId = null;
  state.workList = null;
  renderCRMListView();
}

// ===== WORK THE LIST =====
// Sit down, press one button, and go through everything that is due one lead at a time:
// record open, number in front of you, log the outcome, next. Reps were hunting for their own
// follow-ups a card at a time, which is why so many never got made.
// The queue is FROZEN when you start. Logging a call pushes a lead's follow-up date into the
// future, so a live re-filter would pull leads out from under the rep mid-session.
function dueQueue() {
  const f = state.filters.crm;
  let leads = state.leads.filter(l => l.status === 'crm' && l.crm);
  if (f.assignedTo !== 'all') leads = leads.filter(l => l.assignedTo === f.assignedTo);
  return leads
    .filter(l => {
      const b = followUpBucket(l);
      return b === 'overdue' || b === 'today' ||
             (l.crm.meetingBooked && l.crm.meetingDate && isTodayISO(l.crm.meetingDate));
    })
    .sort((a, b) => {
      const da = daysUntil(a.crm.followUpDate), db = daysUntil(b.crm.followUpDate);
      return (da === null ? 1 : da) - (db === null ? 1 : db);   // most overdue first
    });
}
function startWorkList() {
  const q = dueQueue();
  if (!q.length) { showToast('Nothing due right now. Good place to be.', 'info'); return; }
  state.workList = q.map(l => l.id);
  openCRMSheet(state.workList[0]);
}
// Move to the next lead still in the queue, skipping any that were archived or deleted mid-run.
function advanceWorkList(dir) {
  const list = state.workList;
  if (!list || !list.length) return false;
  let i = list.indexOf(state.crmSheetId);
  if (i < 0) i = dir > 0 ? -1 : list.length;
  for (let step = i + dir; step >= 0 && step < list.length; step += dir) {
    const l = getLeadById(list[step]);
    if (l && l.status === 'crm') {
      state.crmDetailsOpen[state.crmSheetId] = false;
      openCRMSheet(list[step]);
      return true;
    }
  }
  return false;
}
function finishWorkList() {
  const done = (state.workList || []).length;
  state.workList = null;
  closeCRMSheet();
  showSection('crm');
  showToast(done ? 'List worked. ' + done + ' lead' + (done === 1 ? '' : 's') + ' covered.' : 'List closed.', 'success');
}

function renderCRMList(leads) {
  if (leads.length === 0) {
    return `
      <div class="empty-state">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="15" y="25" width="90" height="70" rx="6" stroke="currentColor" stroke-width="2" fill="none"/>
          <line x1="15" y1="45" x2="105" y2="45" stroke="currentColor" stroke-width="1.5"/>
          <line x1="50" y1="45" x2="50" y2="95" stroke="currentColor" stroke-width="1.5"/>
          <line x1="80" y1="45" x2="80" y2="95" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <h3>No leads in CRM</h3>
        <p>Move qualified leads to CRM to start managing your outreach pipeline.</p>

  const visible = leads.slice(0, limit);
  let html = '<div style="display:flex;flex-direction:column;gap:var(--space-3);">';
  visible.forEach(l => {
    const crm = l.crm;
    if (!crm) return;
    const pc = getPrimaryContact(l);
    const fuDays = daysUntil(crm.followUpDate);
    const isOverdue = fuDays !== null && fuDays <= 0;
    const priorityColors = { high: 'badge-error', medium: 'badge-orange', low: 'badge-neutral' };
    const expanded = state.expandedNotes[l.id];
    const selected = (state.bulkSelection || []).includes(l.id);
    const showBrief = crm.stage === 3 || crm.meetingBooked;
    const dealProminent = crm.stage === 5 || crm.stage === 6;
    // On phones the card starts as a compact summary; the chevron opens the full editor.
    // On desktop the details are always visible (CSS forces them open).
    const detailsOpen = !!state.crmDetailsOpen[l.id];
    const hasPhone = leadHasPhone(l);
    const enteredOn = stageEnteredOn(l, crm.stage);
    html += `
      <div class="card crm-card${selected ? ' selected' : ''}" id="crm-row-${l.id}">
        <div class="crm-head">
          <input type="checkbox" class="bulk-check" data-action="bulk-toggle" data-scope="crm" data-id="${l.id}" ${selected ? 'checked' : ''} aria-label="Select lead">
          <div class="crm-head-main">
            <div class="crm-name-row">
              <span class="lead-name">${escapeHtml(l.businessName)}</span>
              ${renderScoreBadge(l)}
              ${renderStageMeter(crm.stage)}
            </div>
            <div class="crm-sub">
              ${pc ? `<span>${escapeHtml(pc.name)}${pc.title ? ' · ' + escapeHtml(pc.title) : ''}</span>` : ''}
              ${l.industry ? `<span>${escapeHtml(l.industry)}</span>` : ''}
              <span class="badge deal-badge" title="Deal value">${formatMoney(getDealValue(l))}</span>
              ${enteredOn ? `<span class="crm-entered${isStalled(l) ? ' stalled' : ''}">${enteredOn === todayISO ? 'Moved to ' + getStageName(crm.stage) + ' today' : 'In ' + getStageName(crm.stage) + ' since ' + formatDate(enteredOn)}</span>` : ''}
            </div>
            <div class="crm-badges">
              <span class="badge ${getStageBadge(crm.stage)}">${getStageName(crm.stage)}</span>
              <span class="badge priority-badge ${priorityColors[crm.priority]}" data-action="cycle-priority" data-id="${l.id}" title="Tap to change priority">${crm.priority.charAt(0).toUpperCase() + crm.priority.slice(1)}</span>
              ${isOverdue ? `<span class="overdue-badge"><i data-lucide="alert-triangle" style="width:12px;height:12px;" aria-hidden="true"></i> Overdue</span>` : (crm.followUpDate ? `<span class="badge badge-neutral">Follow up ${formatDate(crm.followUpDate)}</span>` : '')}
              ${crm.meetingBooked ? '<span class="badge badge-purple">Meeting</span>' : ''}
            </div>
            ${renderClaimBadge(l)}
          </div>
          <div class="crm-head-actions">
