function csvEscape(val) {
  if (val === null || val === undefined) return '';
  const s = String(val);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function exportLeadsCSV() {
  const cols = ['Business Name','Industry','City','Website','Status','Stage','In Stage Since','Assigned To','Deal Value','Date Added','Last Contacted','Follow Up On','Primary Contact','Phone','All Phones','Email','Qualification Summary'];
  const rows = [cols.join(',')];
  state.leads.forEach(l => {
    const pc = getPrimaryContact(l) || {};
    // phones[] holds {number} and emails[] holds {address} — reading the object straight out
    // wrote "[object Object]" into every Phone and Email cell of every export.
    const phoneList = []
      .concat((l.phones || []).map(p => (p && p.number) || '').filter(Boolean))
      .concat(pc.phone ? [pc.phone] : []);
    const emailList = []
      .concat((l.emails || []).map(e => (e && e.address) || '').filter(Boolean))
      .concat(pc.email ? [pc.email] : []);
    const phone = phoneList[0] || '';
    const email = emailList[0] || '';
    const stageName = l.crm ? getStageName(l.crm.stage) : '';
    const dv = l.crm ? getDealValue(l) : '';
    const q = l.qualification
      ? [l.qualification.strategyDesign, l.qualification.experienceDesign, l.qualification.digitalCommerce, l.qualification.weaknessesOpportunities].filter(Boolean).join(' | ')
      : '';
    rows.push([
      csvEscape(l.businessName),
      csvEscape(l.industry),
      csvEscape(leadCity(l)),
      csvEscape(l.website),
      csvEscape(l.status),
      csvEscape(stageName),
      csvEscape(l.crm ? stageEnteredOn(l, l.crm.stage) : ''),
      csvEscape(l.assignedTo || ''),
      csvEscape(dv),
      csvEscape(l.dateAdded || ''),
      csvEscape((l.crm && l.crm.dateLastContact) || ''),
      csvEscape((l.crm && l.crm.followUpDate) || ''),
      csvEscape(pc.name || ''),
      csvEscape(phone),
      csvEscape(phoneList.join(' / ')),
      csvEscape(email),
      csvEscape(q)
    ].join(','));
  });
  const csv = rows.join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const filename = `crescendo-leads-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.csv`;
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Exported ' + state.leads.length + ' leads', 'success');
}

// ========== BULK ACTIONS ==========
async function applyBulkAction(scope, value) {
  if (!value || !state.bulkSelection || state.bulkSelection.length === 0) return;
  const ids = [...state.bulkSelection];
  let n = 0;
  if (value.startsWith('reassign:')) {
    if (!canReassignLeads()) { showToast('Not allowed', 'error'); return; }
    const to = value.slice('reassign:'.length);
    ids.forEach(id => {
      const l = getLeadById(id);
      if (l) { l.assignedTo = to; addActivity(l, 'reassigned to ' + to); n++; }
    });
  } else if (value.startsWith('stage:')) {
    const s = parseInt(value.slice('stage:'.length));
    ids.forEach(id => {
      const l = getLeadById(id);
      if (l && l.crm && setStage(l, s)) n++;
    });
  } else if (value === 'move-to-crm') {
    // Reps were moving 200+ qualified leads one card at a time.
    ids.forEach(id => {
      const l = getLeadById(id);
      if (l && l.status === 'qualified') { moveToCRM(id); n++; }
    });
  } else if (value === 'archive') {
    ids.forEach(id => { archiveLead(id, 'archived'); n++; });
  } else if (value === 'delete') {
    const ok = await showConfirmSheet({
      title: 'Delete ' + ids.length + ' lead' + (ids.length === 1 ? '' : 's') + '?',
      message: 'This removes them for the whole team and cannot be undone.',
      confirmLabel: 'Delete', danger: true
    });
    if (!ok) return;
    ids.forEach(id => { deleteLead(id); n++; });
  }
  saveState();
  try { CrescendoSync.flush(); } catch (_) {}
  state.bulkSelection = [];
  state.bulkScope = null;
  showToast(n + ' lead' + (n === 1 ? '' : 's') + ' updated', 'success');
  renderAll();
}

// ========== MEETING BRIEF ==========
function pickFounderForLead(lead) {
  const q = lead.qualification || {};
  const scores = {
    'Melusi Ndoro': (q.strategyDesign || '').length,
    'Ayoub Rasol':  (q.experienceDesign || '').length,
    'Joshua Khalili': (q.digitalCommerce || '').length
  };
  let best = 'Melusi Ndoro', bestV = 0;
  Object.keys(scores).forEach(k => { if (scores[k] > bestV) { best = k; bestV = scores[k]; } });
  return bestV > 0 ? best : 'Melusi Ndoro';
}
function getPrimaryGap(lead) {
  const w = (lead.qualification && lead.qualification.weaknessesOpportunities) || '';
  const first = w.split('\n')[0].replace(/^[-*\s]+/, '').trim();
  return first || 'Not yet identified, probe for the single biggest friction point in the first 10 minutes.';
}
function getRecommendedAngle(lead) {
  const founder = pickFounderForLead(lead);
  const pillar = founder === 'Melusi Ndoro' ? 'Strategy & Design'
               : founder === 'Ayoub Rasol' ? 'Experience Design'
               : 'Digital Commerce';
  const mapping = {
    'Strategy & Design': "Lead with positioning. Most of their friction is upstream, the offer, the story, the brand. Show them we fix the root cause, not the symptoms.",
    'Experience Design': "Lead with the journey. Their growth ceiling is UX. Walk them through one concrete screen-level improvement we'd ship in week one.",
    'Digital Commerce':  "Lead with the funnel. They're leaking revenue somewhere specific. Name the leak, size it, then show how we plug it."
  };
  return mapping[pillar];
}
function getOpeningQuestions(lead) {
  const industry = (lead.industry || '').toLowerCase();
  const q = lead.qualification || {};
  const base = [
    "What's the one thing about how you're growing right now that keeps you up at night?",
    "If we could fix one thing about how customers find you or buy from you, what would it be?",
    "Who inside your business actually owns this problem, and what have they tried already?"
  ];
  if (/restaurant|food|bakery|coffee/.test(industry)) base[0] = "Walk me through a typical Friday night, where does the operation feel tightest?";
  if (/ecommerce|shop|retail/.test(industry)) base[0] = "Where in the funnel are you losing the most, traffic, conversion, or repeat?";
  return base;
}
function getRedFlags(lead) {
  const flags = [];
  const notes = (lead.crm && lead.crm.notes || []).map(n => (n.text || '').toLowerCase()).join(' ');
  const q = lead.qualification || {};
  if (/budget|cheap|price|cost/i.test(notes)) flags.push("Price-sensitive signals in notes, anchor value early.");
  if (/agency|consultant|already/i.test(notes)) flags.push("Mentioned existing agency relationship, understand what's working and what's not before positioning us.");
  if (!q.growthIntent || q.growthIntent.trim().length < 20) flags.push("Growth intent is thin, probe for urgency and specific targets.");
  if (!lead.crm || !lead.crm.dateFirstContact) flags.push("No prior contact recorded, verify the meeting booking is real before the call.");
  return flags;
}
function buildBriefText(lead) {
  const pc = getPrimaryContact(lead) || {};

  const gap = getPrimaryGap(lead);
  const angle = getRecommendedAngle(lead);

  const recent = (lead.activity || []).slice(0, 5).map(a => `- ${a.by} ${a.action} (${formatTimeAgo(a.date)})`).join('\n') || '- No recent activity logged';

}
function findSimilarLeads(name) {
  const norm = normaliseBusinessName(name);
  if (norm.length < 3) return [];
  return state.leads.filter(l => {
    const ln = normaliseBusinessName(l.businessName);
    if (!ln) return false;
    return ln === norm || ln.includes(norm) || norm.includes(ln);
  });
}

## The 8-Step Discovery Framework

### Step 1: Set the Environment
Clean, professional, prepared before you join.

### Step 2: Start With Your Story (60-90 seconds)
- Why you started Crescendo
- What you've learned
- Who you work with
- Keep it human, confident, calm
- Don't jump into "what we do"

### Step 3: Invite Their Story
"Would love to hear a bit more about you, how you got started, and what you're working on."
Let them talk. Listen closely. This is where you find the real problems.

### Step 4: Frame the Call
"The goal of today is simple. I want to walk you through some ideas I think could really help. We've done a bit of homework and spotted a few opportunities, I'd love to get your take. If it feels like the right fit, we can take it from there."
Keep it low-pressure. Position as collaborative.

### Step 5: Use a Deck (But Don't Read It)
- Share tab (not entire screen)
- Split view so you can see their reactions
- Talk around the slides, not through them
- Pause often: "Does that resonate?" "Would love to hear your take."

### Step 6: Go Off-Script When It Matters
If conversation opens up and you sense momentum, close the deck and just talk. Great sales calls feel like great conversations.

### Step 7: Share Value Mid-Call
If they mention a problem you can solve, show, don't tell.
- Pull up an ad example
- Share a case study live
- Show a relevant funnel breakdown
Way more impactful than sending a PDF later.

### Step 8: End With a Clear Next Step
"This has been great. Let's take a few days to think things through. How about we jump on a second call next week, same time? I'll send over the slides and a few ideas to explore before then."

Immediately follow up with:
- Summary of key points
- The deck
- Calendar link for Call 2
- 3-5 tailored insights, examples, or mockups to keep momentum alive

  msgArea.appendChild(typing);
  msgArea.scrollTop = msgArea.scrollHeight;

  // Build messages
  let systemMsg = CHAT_SYSTEM_PROMPT;
  if (chatLearnings.length > 0) {
    systemMsg += '\n\nPrevious learnings from the team:\n' + chatLearnings.map((l, i) => `${i+1}. ${l}`).join('\n');
  }
  const leadCtx = getLeadContext();
  let contextMsg = '';
  if (leadCtx) {
    contextMsg = '\n\n[Current lead in view: ' + JSON.stringify({
      businessName: leadCtx.businessName, industry: leadCtx.industry, website: leadCtx.website,
      qualification: leadCtx.qualification, crm: leadCtx.crm ? { stage: getStageName(leadCtx.crm.stage), disposition: leadCtx.crm.disposition, priority: leadCtx.crm.priority } : null
    }) + ']';
  }

  // Gemini expects role: 'user' | 'model', system prompt goes in systemInstruction,
  // and the message array carries the turn history. The latest user message is already
  // the last entry in chatHistory (we pushed it above), so we include the full history.
  const contents = chatHistory.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));

  // Append the lead context to the final user message (so it stays with that turn).
  if (contextMsg && contents.length > 0) {
    const last = contents[contents.length - 1];
    last.parts[0].text = last.parts[0].text + contextMsg;
  }

  try {
    const resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + encodeURIComponent(apiKey), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents,
        systemInstruction: { parts: [{ text: systemMsg }] },
        generationConfig: { temperature: 0.7, maxOutputTokens: 1024 }
      })
    });
    typing.remove();
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      const errMsg = err.error?.message || 'API error (' + resp.status + ')';
      chatHistory.push({ role: 'assistant', content: 'Error: ' + errMsg });
    } else {
      const data = await resp.json();
      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response received.';
      chatHistory.push({ role: 'assistant', content: reply });

      // Check for learnings
      const learningMatch = reply.match(/\[LEARNING\]:\s*(.*?)(?:\n|$)/gi);
      if (learningMatch) {
        learningMatch.forEach(m => {
          const text = m.replace(/\[LEARNING\]:\s*/i, '').trim();
          if (text) chatLearnings.push(text);
        });
      }
    }
  } catch (e) {
    typing.remove();
    chatHistory.push({ role: 'assistant', content: 'Connection error: ' + e.message });
  }
  saveChatState();
  renderChatMessages();
}

async function testGeminiConnection() {
  const resultEl = document.getElementById('chat-test-result');
  const apiKey = document.getElementById('chat-api-key').value.trim() || getApiKey();
  if (!apiKey) {
    resultEl.textContent = 'Enter a key first.';
    resultEl.style.color = 'var(--color-danger, #c0392b)';
    return;
  }
  resultEl.textContent = 'Testing...';
  resultEl.style.color = 'var(--color-text-muted)';
  try {
    const resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + encodeURIComponent(apiKey), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: 'Reply with the single word: ok' }] }],
        generationConfig: { temperature: 0, maxOutputTokens: 10 }
      })
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      resultEl.textContent = 'Failed: ' + (err.error?.message || 'HTTP ' + resp.status);
      resultEl.style.color = 'var(--color-danger, #c0392b)';
      return;
    }
    const data = await resp.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (reply) {
      resultEl.textContent = 'Success, Gemini responded.';
      resultEl.style.color = 'var(--color-success, #1a7f37)';
    } else {
      resultEl.textContent = 'Unexpected response shape.';
      resultEl.style.color = 'var(--color-danger, #c0392b)';
    }
  } catch (e) {
    resultEl.textContent = 'Connection error: ' + e.message;
    resultEl.style.color = 'var(--color-danger, #c0392b)';
  }
}

// ========== INIT ==========
function init() {
  applySavedTheme();
  // Check if user is already logged in
  if (isLoggedIn()) {
    const user = getCurrentUser();
    document.getElementById('current-user-display').textContent = user;
    hideLoginOverlay();
  } else if (typeof rebuildLoginRepOptions === 'function') {
    // Not logged in: the overlay is visible by default — populate the rep picker now.
    rebuildLoginRepOptions();
  }
  updateMasterUI();
  renderResetButton();
  renderExportButton();
  applyConsultantDefaults();
  loadChatState();
  // Ensure home is the default section on first login unless user has a saved pref
  if (!state.activeSection) state.activeSection = 'home';
  // Reflect persisted activeSection into UI
  showSection(state.activeSection);
  lucide.createIcons();
  // Boot shared-backend sync (safe no-op if Firebase isn't configured).
  startSharedSync();
  // Phones suspend background tabs aggressively — commit any pending cloud writes the
  // moment the app is backgrounded or the page is being torn down.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { try { CrescendoSync.flush(); } catch (_) {} }
  });
  window.addEventListener('pagehide', () => { try { CrescendoSync.flush(); } catch (_) {} });
  // Keep "x min ago" labels and 15-min claim badges honest without user interaction.
  // Skipped while typing or while a modal/panel/sheet is open so it never eats input.
  setInterval(() => {
    // Roll the date over first — a tab left open past midnight otherwise keeps counting
    // yesterday's work as "today".
    refreshToday();
    if (document.hidden || state.modalOpen || state.panelOpen || isMoreSheetOpen() || _actionSheetResolve) return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return;
    renderActiveSection();
  }, 60000);
  // Phones suspend timers; catch the rollover the moment the app comes back too, and ask how
  // the call the rep just made went.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (refreshToday()) renderAll();
    askPendingCallOutcome();
  });
  window.addEventListener('focus', () => { askPendingCallOutcome(); });
}

// WHICH SIDE OF A MERGE IS NEWER — the rule that decides whether a rep's change sticks.
// In priority order:
//  1. An edit this device made that the cloud has not confirmed always survives, so a snapshot
//     landing mid-edit can never undo what the rep just did.
//  2. Otherwise trust _srvAt, the SERVER's clock, written on every push. _modAt is the device
//     wall-clock, so one phone set a few minutes fast used to beat everyone else's fresher
//     work — the last remaining way a change could silently revert.
//  3. Fall back to _modAt when either side has never been server-stamped (offline edits).
function mergeRemoteWins(local, remote) {
  if (!local) return true;
  if (!remote) return false;
  let unsynced = false;
  try { unsynced = CrescendoSync.hasUnsyncedEdit(remote.id); } catch (_) {}
  if (unsynced) return false;
  const rSrv = (typeof remote._srvAt === 'string') ? remote._srvAt : '';
  const lSrv = (typeof local._srvAt === 'string') ? local._srvAt : '';
  if (rSrv && lSrv && rSrv !== lSrv) return rSrv > lSrv;
  const rAt = (typeof remote._modAt === 'string') ? remote._modAt : '';
  const lAt = (typeof local._modAt === 'string') ? local._modAt : '';
  return rAt > lAt;
}

// Initialize Firestore sync + merge remote leads into local state, live.
async function startSharedSync() {
  try {
    const ok = await CrescendoSync.init();
    if (!ok) {
      CrescendoSync.showSyncStatus('offline');
      return;
    }
    CrescendoSync.subscribe((remoteLeads, meta) => {
      meta = meta || {};
      // SAFE PER-LEAD MERGE: union of local + remote by id, keeping whichever copy has
      // the newer _modAt (ISO string compare; missing/empty _modAt is treated as oldest).
      // This never clobbers a local edit the rep just made that hasn't pushed yet.
      const byId = new Map();
      const localList = Array.isArray(state.leads) ? state.leads : [];
      // Never carry a locally-held tombstone forward — it must not render or re-push.
      for (const l of localList) { if (l && l.id && !l._deleted) byId.set(l.id, l); }
      for (const r of remoteLeads) {
        if (!r || !r.id) continue;
        const local = byId.get(r.id);
        // TOMBSTONE DROP (read side of H3): a {_deleted:true} doc means another rep deleted
        // this lead. Remove it locally unless the local copy is strictly newer (a rep edited
        // AFTER the delete — edit beats delete, and the next push resurrects it deliberately).
        if (r._deleted) {
          if (local) {
            const rAtD = (typeof r._modAt === 'string') ? r._modAt : '';
            const lAtD = (typeof local._modAt === 'string') ? local._modAt : '';
            if (rAtD >= lAtD) byId.delete(r.id);
          }
          continue; // never merge the tombstone itself into the lead list
        }
        if (!local) { r.__remoteStamped = true; byId.set(r.id, r); continue; }
        const remoteWins = mergeRemoteWins(local, r);
        // ACTIVITY IS ADDITIVE: whole-doc newest-wins would silently drop the loser's
        // just-logged call when two reps touch the SAME lead near-simultaneously. Union both
        // sides' activity into whichever doc wins so no call/disposition history is ever lost.
        const __k = a => `${(a && a.date) || ''}|${(a && a.action) || ''}|${(a && a.by) || ''}`;
        const winner = remoteWins ? r : local;
        const loser = remoteWins ? local : r;
        const have = new Set((winner.activity || []).map(__k));
        for (const a of (loser.activity || [])) {
          if (!have.has(__k(a))) { (winner.activity = winner.activity || []).push(a); have.add(__k(a)); }
        }
        if (Array.isArray(winner.activity)) winner.activity.sort((a, b) => String((b && b.date) || '').localeCompare(String((a && a.date) || '')));
        if (remoteWins) { r.__remoteStamped = true; byId.set(r.id, r); }
        // else keep local (an unpushed edit, or a tie) and let it push on next saveState.
      }
      // Surface the first-snapshot empty-cloud signal to the deferred seed-push gate. A
      // cache-only snapshot must never answer this — see the CACHE SAFETY note in subscribe().
      if (meta.firstSnapshot && !meta.fromCache) { CrescendoSync.__cloudKnownEmpty = !!meta.cloudEmpty; }
      // Drop the fictional sample leads once real cloud data is present.
      let merged = Array.from(byId.values());
      if (remoteLeads.length > 0) merged = merged.filter(l => l && l.source !== 'sample');
      // CLONE COLLAPSE (data-integrity): an earlier build could mint duplicate lead docs
      // (same businessName, new id). Such clones can linger in a rep's localStorage and would
      // otherwise be re-pushed by the push-back below as fresh cloud docs. Collapse any
      // LOCAL-ONLY lead whose businessName already exists in the cloud onto the canonical
      // remote lead — unioning its activity so no call history is lost — then drop it so it is
      // never recreated. A local-only lead with a NEW businessName is a genuine new lead: kept.
      if (remoteLeads.length > 0) {
        const __remoteIds = new Set();
        for (const r of remoteLeads) { if (r && r.id) __remoteIds.add(r.id); }
        // Canonical = the merged lead that owns a real cloud id, keyed by businessName.
        const __canonByName = new Map();
        for (const l of merged) {
          if (!l || !__remoteIds.has(l.id)) continue;
          const k = (l.businessName || '').trim().toLowerCase();
          if (k && !__canonByName.has(k)) __canonByName.set(k, l);
        }
        const __akey = a => `${(a && a.date) || ''}|${(a && a.action) || ''}|${(a && a.by) || ''}`;
        merged = merged.filter(l => {
          if (!l) return false;
          if (__remoteIds.has(l.id)) return true;            // canonical cloud lead, keep
          const k = (l.businessName || '').trim().toLowerCase();
          const canon = k ? __canonByName.get(k) : null;
          if (!canon || canon === l) return true;            // genuinely new lead, keep & sync
          // duplicate of an existing cloud lead → fold activity into the canonical lead, drop clone.
          const have = new Set((canon.activity || []).map(__akey));
          for (const a of (l.activity || [])) {
            if (!have.has(__akey(a))) { (canon.activity = canon.activity || []).push(a); have.add(__akey(a)); }
          }
          if (Array.isArray(canon.activity)) canon.activity.sort((a, b) => String((b && b.date) || '').localeCompare(String((a && a.date) || '')));
          return false;
        });
      }
      state.leads = merged;
      // __applyingRemote so saveState below doesn't re-stamp the just-merged remote leads.
      CrescendoSync.__applyingRemote = true;
      try {
        try { localStorage.setItem('crescendo-leads', JSON.stringify(state.leads)); } catch (_) {}
      } finally { CrescendoSync.__applyingRemote = false; }
      // Push back any local-only or locally-newer leads the merge kept (real leads only).
      // Deferred a tick: while the snapshot handler is running, the sync module's
      // applyingRemote guard makes pushLeads a no-op — calling it inline did nothing,
      // so offline work only reached the cloud on the rep's NEXT edit.
      setTimeout(() => { try { CrescendoSync.pushLeads(state.leads); } catch (_) {} }, 0);
      // Clear the per-merge stamp markers now that this snapshot is fully applied, and record
      // every merged lead's content. Without the seed, the next saveState would treat all ~540
      // leads as changed and republish the whole book over other reps' newer work — see
      // seedLeadHashes. A local copy that WON the merge keeps its own fresher _modAt, and its
      // push is still due because the sync ledger holds the remote version, not this one.
      for (const l of state.leads) { if (l) delete l.__remoteStamped; }
      seedLeadHashes(state.leads);
      if (typeof renderAll === 'function') renderAll();
    });
    // First-EVER seed-push: only when the cloud is genuinely empty (fresh setup) AND our
    // local leads are real (not the fictional samples). Never push over existing cloud data.
    setTimeout(() => {
      if (!CrescendoSync.__cloudSeeded && CrescendoSync.__cloudKnownEmpty &&
          Array.isArray(state.leads) && state.leads.some(l => l && l.source !== 'sample')) {
        CrescendoSync.__cloudSeeded = true;
        CrescendoSync.pushLeads(state.leads.filter(l => l && l.source !== 'sample'));
      }
    }, 1500);
  } catch (e) {
    console.warn('startSharedSync failed', e);
  }
}
document.addEventListener('DOMContentLoaded', init);
