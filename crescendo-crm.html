const RESEARCH_ITEMS = [
  'Visited website (desktop)',
  'Checked mobile experience',
  'Reviewed Google reviews',
  'Checked Instagram/social media',
  'Noted 2-3 specific observations',
  'Identified primary gap',
  'Identified which service line fits'
];
function renderResearchChecklist(lead) {
  if (!lead.researchChecklist) lead.researchChecklist = [];
  const items = RESEARCH_ITEMS.map((label, i) => {
    const checked = lead.researchChecklist.includes(i);
    return `<label><input type="checkbox" data-action="research-check" data-id="${lead.id}" data-index="${i}" ${checked ? 'checked' : ''}> ${escapeHtml(label)}</label>`;
  }).join('');
  const done = lead.researchChecklist.length;
  const total = RESEARCH_ITEMS.length;
  return `<div class="research-checklist"><h4>Research Checklist (${done}/${total})</h4>${items}</div>`;
}

function renderCRMBoard(leads) {
  const PER_COL = 25; // cap card DOM per column, filters narrow the rest
  let html = '<div class="kanban-board">';
  STAGES.forEach(stage => {
    const stageLeads = leads.filter(l => l.crm && l.crm.stage === stage.num);
    const visible = stageLeads.slice(0, PER_COL);
    // How many landed in THIS stage today. The old board showed a single total, so there was
    // no way to answer "how many did the team move into Contacted today" without guessing.
    const todayCount = stageLeads.filter(l => stageEnteredOn(l, stage.num) === todayISO).length;
    html += `
      <div class="kanban-column" data-stage="${stage.num}">
        <div class="kanban-column-header">
          <span class="kanban-column-title">${stage.name}</span>
          <span class="kanban-column-tally">
            ${todayCount ? `<span class="kanban-column-today" title="Moved into ${stage.name} today">+${todayCount} today</span>` : ''}
            <span class="kanban-column-count">${stageLeads.length}</span>
          </span>
        </div>
        <div class="kanban-cards" data-stage="${stage.num}">
          ${visible.map(l => {
            const pc = getPrimaryContact(l);
            const crm = l.crm;
            const priorityColors = { high: 'badge-error', medium: 'badge-orange', low: 'badge-neutral' };
            const fuDays = daysUntil(crm.followUpDate);
            const enteredOn = stageEnteredOn(l, stage.num);
            const phone = (l.phones && l.phones[0] && l.phones[0].number) || (pc && pc.phone) || '';
            return `
              <div class="kanban-card" draggable="true" data-id="${l.id}" data-action="open-crm-sheet" role="button" tabindex="0" aria-label="Open ${escapeHtml(l.businessName)}">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);"><div class="card-name">${escapeHtml(l.businessName)}</div>${renderScoreBadge(l)}</div>
                ${pc ? `<div class="card-contact">${escapeHtml(pc.name)}</div>` : ''}
                ${phone ? `<div class="card-phone"><i data-lucide="phone" aria-hidden="true"></i> ${escapeHtml(phone)}</div>` : ''}
                ${enteredOn ? `<div class="card-entered">${enteredOn === todayISO ? 'Moved here today' : 'Here since ' + formatDate(enteredOn)}</div>` : ''}
                <div class="card-meta">
                  <span class="badge ${priorityColors[crm.priority]}">${crm.priority}</span>
                  <span class="badge deal-badge" title="Deal value">${formatMoney(getDealValue(l))}</span>
                  ${crm.followUpDate ? `<span style="font-size:0.65rem;color:${fuDays !== null && fuDays <= 0 ? 'var(--color-warning)' : 'var(--color-text-muted)'};">${fuDays !== null && fuDays <= 0 ? 'Overdue' : 'Follow up ' + formatDate(crm.followUpDate)}</span>` : ''}
                  ${crm.meetingBooked ? `<span class="badge badge-purple">Meeting</span>` : ''}
                </div>
                ${l.assignedTo ? `<div class="assigned-badge"><i data-lucide="user" aria-hidden="true"></i> ${escapeHtml(l.assignedTo)}</div>` : ''}
                ${l.activity && l.activity.length > 0 ? `<div style="font-size:0.6rem;color:var(--color-text-faint);margin-top:4px;">${escapeHtml(l.activity[0].by)} ${escapeHtml(l.activity[0].action)} ${formatTimeAgo(l.activity[0].date)}</div>` : ''}
                <div style="display:flex;gap:var(--space-1);margin-top:var(--space-2);align-items:center;">
                  <button class="btn btn-ghost btn-sm btn-generate-email" style="font-size:0.65rem;padding:2px 8px;min-height:32px;" data-action="generate-email" data-id="${l.id}"><i data-lucide="mail" aria-hidden="true" style="width:11px;height:11px;"></i> Email</button>
                </div>
                <!-- Tap-based stage moves, HTML5 drag-and-drop doesn't exist on touch screens -->

                  <button data-action="kanban-move" data-id="${l.id}" data-dir="-1" ${stage.num <= 1 ? 'disabled' : ''} aria-label="Move to previous stage"><i data-lucide="chevron-left" aria-hidden="true"></i> Back</button>
                  <button data-action="kanban-move" data-id="${l.id}" data-dir="1" ${stage.num >= 6 ? 'disabled' : ''} aria-label="Move to next stage">Next <i data-lucide="chevron-right" aria-hidden="true"></i></button>
                </div>
              </div>
            `;
          }).join('')}
          ${stageLeads.length > PER_COL ? `<div style="text-align:center;font-size:var(--text-2xs);color:var(--color-text-faint);padding:var(--space-2);">+${stageLeads.length - PER_COL} more, narrow with filters</div>` : ''}

function initKanbanDrag() {
  let draggedId = null;
  document.querySelectorAll('.kanban-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      draggedId = card.dataset.id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.kanban-column').forEach(c => c.classList.remove('drag-over'));
    });
  });
  document.querySelectorAll('.kanban-cards').forEach(col => {
    col.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.closest('.kanban-column').classList.add('drag-over');
    });
    col.addEventListener('dragleave', e => {
      if (!col.contains(e.relatedTarget)) {
        col.closest('.kanban-column').classList.remove('drag-over');
      }
    });
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.closest('.kanban-column').classList.remove('drag-over');
      const newStage = parseInt(col.dataset.stage);
      if (draggedId && newStage) {
        const lead = getLeadById(draggedId);
        if (lead && lead.crm && setStage(lead, newStage)) {
          saveState();
          showToast(`${lead.businessName} moved to ${getStageName(newStage)}`, 'info');
          renderCRM();
          renderSidebarBadges();
        }
      }
      draggedId = null;
    });
  });
}

// ========== EMAIL GENERATION ==========
function getEmailTemplate(lead) {
  const ind = (lead.industry || '').toLowerCase();
  if (/food|beverage|restaurant|bakery|coffee|pizza|chicken|dessert/.test(ind)) return 'restaurant';
  if (/health|clinic|medical|dental|beauty|aesthetics/.test(ind)) return 'healthcare';
  if (/e-commerce|ecommerce|retail|shop|fashion|boutique/.test(ind)) return 'ecommerce';
  if (/professional|law|legal|finance|consulting|agency/.test(ind)) return 'professional';
  if (/tourism|hotel|travel|experience/.test(ind)) return 'tourism';
  return 'general';
}

function getWeaknessNote(lead) {
  if (lead.qualification && lead.qualification.weaknessesOpportunities) {
    const raw = lead.qualification.weaknessesOpportunities.trim();
    const firstLine = raw.split('\n')[0].replace(/^[-*\s]+/, '').trim();
    if (firstLine.length > 10) {
      const note = firstLine.endsWith('.') ? firstLine : firstLine + '.';
      return 'I noticed ' + note.charAt(0).toLowerCase() + note.slice(1);
    }
  }
  return 'Right now, the site could do more to convert mobile visitors.';
}

function generateEmail(lead) {
  const pc = getPrimaryContact(lead);
  const contactName = pc ? pc.name.split(' ')[0] : 'there';
  const biz = lead.businessName;
  const user = getCurrentUser();
  const weakness = getWeaknessNote(lead);
  const tmpl = getEmailTemplate(lead);
  const sign = user + '\nCrescendo Strategy\nCambridge\ncrsndo.com';

  const templates = {
    restaurant: {
      subject: 'Quick note about ' + biz,
      body: 'Hi ' + contactName + ',\n\nI was looking at ' + biz + ' online and the menu and reviews look strong.\n\nThe booking and ordering journey could make it easier for people to commit. ' + weakness + '\n\nIf useful, I can send three quick fixes and a simple way to surface your best reviews and signature dishes so new customers decide faster.\n\nShould I send it over?\n\nRegards,\n' + sign
    },
    healthcare: {
      subject: biz + ' trust and booking',
      body: 'Hi ' + contactName + ',\n\nI was looking at ' + biz + ' online and it is clear you take quality seriously.\n\nOne thing that could be tightened is how trust and safety are communicated at the point of decision. ' + weakness + '\n\nIf you want, I can send a short mini audit focused on credentials visibility, clear expectations, and a simpler path to booking.\n\nReply yes and I will send it over.\n\nRegards,\n' + sign
    },
    ecommerce: {
      subject: biz + ' conversion review',
      body: 'Hi ' + contactName + ',\n\nQuick note after a fast review of ' + biz + ' online.\n\nYour products look strong, but a few details in the decision journey are likely suppressing conversion. ' + weakness + '\n\nIf you want, I can send three specific fixes and the first set of events to track so you can measure uplift.\n\nShould I send that in a reply?\n\nRegards,\n' + sign
    },
    professional: {
      subject: biz + ' positioning question',
      body: 'Hi ' + contactName + ',\n\nI took a look at ' + biz + '. The capability looks strong, but the positioning is not landing as quickly as it could.\n\n' + weakness + ' That tends to create slower decision cycles because the site does not answer the first three questions a buyer has: Who is this for? What outcome do you deliver? Why should I trust you?\n\nIf useful, I can send a mini audit with copy and structure changes that make enquiries more qualified.\n\nOpen to a quick call, or should I send the bullets?\n\nRegards,\n' + sign
    },
    tourism: {
      subject: biz + ' booking journey',
      body: 'Hi ' + contactName + ',\n\nI was reviewing ' + biz + ' online and the experience looks strong.\n\nThe booking and pre arrival journey could match that quality more closely. ' + weakness + '\n\nIf you want, I can send a mini audit with the key changes I would make for clarity, reassurance, and faster bookings, plus the one metric to track week by week.\n\nShould I send it over?\n\nRegards,\n' + sign
    },
    general: {
      subject: 'Quick note about ' + biz,
      body: 'Hi ' + contactName + ',\n\nI was looking at ' + biz + ' online and one thing stood out.\n\nThe offer looks strong, but the path from interest to booking is not as clear as it could be, especially on mobile. That is usually where good businesses quietly lose enquiries.\n\n' + weakness + '\n\nIf you want, I can send a short mini audit with three specific fixes based on what I saw, plus the one change I would prioritise first.\n\nIf that is useful, just reply yes and tell me who owns the website decisions.\n\nRegards,\n' + sign
    }
  };

  const email = templates[tmpl];

  // Follow-up email
  const followUp = {
    subject: 'Re: ' + email.subject,
    body: 'Hi ' + contactName + ',\n\nJust following up on my note from a couple of days ago.\n\nI had a few specific ideas for ' + biz + ' that I think could make a real difference. Happy to share them if you are interested.\n\nNo worries if the timing is not right.\n\nRegards,\n' + sign
  };

  // LinkedIn message
  const linkedin = 'Hi ' + contactName + ', I took a look at ' + biz + ' online and had a few ideas on how to improve the customer journey. Would you be open to a quick chat or should I send a few bullet points over?';

  return { email, followUp, linkedin };
}

// ========== RENDER: MEETINGS ==========
function renderMeetings() {
  const container = document.getElementById('meetings-content');
  const meetingLeads = state.leads.filter(l => l.status === 'crm' && l.crm && l.crm.meetingBooked);
  const now = new Date();
  const weekFromNow = new Date(now.getTime() + 7 * 86400000);

  const upcoming = meetingLeads.filter(l => l.crm.meetingDate && new Date(l.crm.meetingDate) >= now);
  const upcomingWeek = upcoming.filter(l => new Date(l.crm.meetingDate) <= weekFromNow);
  // A meeting whose time has passed is NOT automatically a meeting that happened. Counting it
  // as completed flattered the numbers and, worse, hid the Mark Complete button the moment the
  // clock passed the slot — so the stage never advanced and leads piled up in Meeting Booked
  // with nothing telling anyone they needed dealing with.
  const completed = meetingLeads.filter(l => l.crm.stage >= 4);
  const awaiting = meetingLeads.filter(l => l.crm.stage < 4 && l.crm.meetingDate && new Date(l.crm.meetingDate) < now);
  const totalBooked = meetingLeads.length;

  let html = `
    <div class="section-header">
      <h1>Meetings</h1>
      <div class="view-toggle">
        <button class="view-toggle-btn ${state.meetingsView === 'list' ? 'active' : ''}" data-action="meetings-view" data-view="list" aria-label="List view"><i data-lucide="list" aria-hidden="true"></i> List</button>
        <button class="view-toggle-btn ${state.meetingsView === 'calendar' ? 'active' : ''}" data-action="meetings-view" data-view="calendar" aria-label="Calendar view"><i data-lucide="calendar" aria-hidden="true"></i> Calendar</button>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat-chip"><span>Total Booked:</span><span class="stat-value">${totalBooked}</span></div>
      <div class="stat-chip teal"><span>Upcoming (7 days):</span><span class="stat-value">${upcomingWeek.length}</span></div>
      ${awaiting.length ? `<div class="stat-chip amber"><span>Needs an outcome:</span><span class="stat-value">${awaiting.length}</span></div>` : ''}
      <div class="stat-chip green"><span>Completed:</span><span class="stat-value">${completed.length}</span></div>

function renderMeetingsList(leads, now) {
  const sorted = [...leads].sort((a, b) => {
    const aDate = a.crm.meetingDate ? new Date(a.crm.meetingDate) : new Date(9999, 0);
    const bDate = b.crm.meetingDate ? new Date(b.crm.meetingDate) : new Date(9999, 0);
    return aDate - bDate;
  });
  const upcoming = sorted.filter(l => l.crm.meetingDate && new Date(l.crm.meetingDate) >= now);
  // Three states, not two. "Past" used to mean "done", which was never true and left the
  // Mark Complete button unreachable the moment the slot went by.
  const awaiting = sorted.filter(l => l.crm.stage < 4 && l.crm.meetingDate && new Date(l.crm.meetingDate) < now);
  const done = sorted.filter(l => l.crm.stage >= 4 && l.crm.meetingDate && new Date(l.crm.meetingDate) < now);

  const heading = (text, extra) => `<h3 style="font-family:var(--font-display);font-weight:600;font-size:var(--text-sm);color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.05em;${extra || ''}">${text}</h3>`;
  let html = '<div style="display:flex;flex-direction:column;gap:var(--space-4);">';

  if (awaiting.length) {
    html += heading('Needs an outcome');
    awaiting.forEach(l => { html += renderMeetingCard(l, 'awaiting'); });
  }
  if (upcoming.length) {
    html += heading('Upcoming', awaiting.length ? 'margin-top:var(--space-4);' : '');
    upcoming.forEach(l => { html += renderMeetingCard(l, 'upcoming'); });
  }
  if (done.length) {
    html += heading('Completed', 'margin-top:var(--space-4);');
    done.forEach(l => { html += renderMeetingCard(l, 'done'); });
  }
  html += '</div>';
  return html;
}

function renderMeetingCard(l, mode) {
  const pc = getPrimaryContact(l);
  const isPast = mode !== 'upcoming';
  return `
    <div class="card meeting-card ${isPast ? 'past' : ''}${mode === 'awaiting' ? ' awaiting' : ''}">
      <div class="meeting-date-display">${l.crm.meetingDate ? formatDateTime(l.crm.meetingDate) : 'No date set'}</div>
      <div class="meeting-card-body">
        <div style="display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;">
          <span style="font-family:var(--font-display);font-weight:700;">${escapeHtml(l.businessName)}</span>
          ${l.industry ? `<span class="badge badge-neutral">${escapeHtml(l.industry)}</span>` : ''}
          <span class="badge ${getStageBadge(l.crm.stage)}">${getStageName(l.crm.stage)}</span>
          ${mode === 'done' ? '<span class="badge badge-success">Completed</span>' : ''}

        ${l.crm.meetingNotes ? `<p style="font-size:var(--text-sm);color:var(--color-text-muted);">${escapeHtml(l.crm.meetingNotes)}</p>` : ''}
        <div class="meeting-card-actions">
          ${mode !== 'done' ? `<button class="btn btn-primary btn-sm" data-action="mark-meeting-complete" data-id="${l.id}"><i data-lucide="check" aria-hidden="true"></i> ${mode === 'awaiting' ? 'It happened' : 'Mark Complete'}</button>` : ''}
          ${mode !== 'done' ? `<button class="btn btn-secondary btn-sm" data-action="reschedule-meeting" data-id="${l.id}"><i data-lucide="calendar" aria-hidden="true"></i> ${mode === 'awaiting' ? "Didn't happen, rebook" : 'Reschedule'}</button>` : ''}
          <button class="btn btn-ghost btn-sm" data-action="go-to-crm-lead" data-id="${l.id}"><i data-lucide="external-link" aria-hidden="true"></i> View in CRM</button>
        </div>
      </div>

  `;

function renderMeetingsCalendar(meetingLeads) {
  const year = state.calendarYear;
  const month = state.calendarMonth;
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDayOfWeek = firstDay.getDay();
  const totalDays = lastDay.getDate();

  // todayISO, not today.toISOString(): the calendar was highlighting "today" off a UTC date
  // frozen at page load, so it sat on the wrong square after midnight and after a long session.
  const todayStr = todayISO;

  // Meetings by date
  const meetingsByDate = {};
  meetingLeads.forEach(l => {
    if (l.crm.meetingDate) {
      const d = l.crm.meetingDate.split('T')[0];
      if (!meetingsByDate[d]) meetingsByDate[d] = [];
      meetingsByDate[d].push(l);
    }
  });

  let html = `
    <div class="calendar-nav">
      <button class="btn btn-ghost btn-sm" data-action="cal-prev" aria-label="Previous month"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <h3>${months[month]} ${year}</h3>
      <button class="btn btn-ghost btn-sm" data-action="cal-next" aria-label="Next month"><i data-lucide="chevron-right" aria-hidden="true"></i></button>
    </div>
    <div class="calendar-grid">
  `;
  days.forEach(d => { html += `<div class="calendar-day-header">${d}</div>`; });

  // Previous month padding
  const prevMonthLastDay = new Date(year, month, 0).getDate();
  for (let i = startDayOfWeek - 1; i >= 0; i--) {
    html += `<div class="calendar-day other-month"><span class="day-number">${prevMonthLastDay - i}</span></div>`;
  }

  // Current month
  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isToday = dateStr === todayStr;
    const meetings = meetingsByDate[dateStr] || [];
    html += `
      <div class="calendar-day ${isToday ? 'today' : ''}" data-date="${dateStr}" style="position:relative;">
        <span class="day-number">${d}</span>
        ${meetings.map(m => `<span class="meeting-dot"></span><span class="meeting-name">${escapeHtml(m.businessName)}</span>`).join('')}
      </div>
    `;
  }

  // Next month padding
  const remaining = 42 - (startDayOfWeek + totalDays);
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="calendar-day other-month"><span class="day-number">${i}</span></div>`;
  }

  html += '</div>';
  return html;
}

// ========== RENDER: ARCHIVE ==========
function renderArchive() {
  const container = document.getElementById('archive-content');
  const archived = state.leads.filter(l => l.status === 'archive');

  const followUpLeads = archived.filter(l => l.crm && (l.crm.disposition === 'follow_up' || l.crm.disposition === 'revisit'));
  const notInterestedLeads = archived.filter(l => l.crm && l.crm.disposition === 'not_interested');
  const archivedLeads = archived.filter(l => l.crm && l.crm.disposition === 'archived');

  const overdueLeads = archived.filter(l => l.crm && l.crm.followUpDate && daysUntil(l.crm.followUpDate) !== null && daysUntil(l.crm.followUpDate) < 0);

  let currentLeads;
  if (state.archiveOverdueOnly) currentLeads = overdueLeads;
  else if (state.archiveTab === 'follow_up') currentLeads = followUpLeads;
  else if (state.archiveTab === 'not_interested') currentLeads = notInterestedLeads;
  else currentLeads = archivedLeads;

  let html = `
    <div class="section-header">
      <h1>Archive / Backlog</h1>
    </div>
  `;

  if (overdueLeads.length > 0) {
    html += `<div class="alert-banner${state.archiveOverdueOnly ? ' active' : ''}" data-action="filter-overdue-archive"><i data-lucide="alert-triangle" aria-hidden="true"></i> ${overdueLeads.length} lead${overdueLeads.length > 1 ? 's have' : ' has'} overdue follow-up dates. ${state.archiveOverdueOnly ? 'Showing them. Tap to show all.' : 'Tap to see them.'}</div>`;
  }

  html += `
    <div class="pill-tabs">
      <button class="pill-tab ${state.archiveTab === 'follow_up' ? 'active' : ''}" data-action="archive-tab" data-tab="follow_up">Follow Up Later <span class="tab-badge">${followUpLeads.length}</span></button>
      <button class="pill-tab ${state.archiveTab === 'not_interested' ? 'active' : ''}" data-action="archive-tab" data-tab="not_interested">Not Interested <span class="tab-badge">${notInterestedLeads.length}</span></button>
      <button class="pill-tab ${state.archiveTab === 'archived' ? 'active' : ''}" data-action="archive-tab" data-tab="archived">Archived <span class="tab-badge">${archivedLeads.length}</span></button>
    </div>
  `;

  if (currentLeads.length === 0) {
    html += `
      <div class="empty-state">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M30 50 L60 30 L90 50 L90 90 L30 90 Z" stroke="currentColor" stroke-width="2" fill="none"/>
          <rect x="50" y="65" width="20" height="25" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
        <h3>Nothing here yet</h3>
        <p>Leads that are archived, not interested, or set for follow-up will appear here.</p>
      </div>
    `;
  } else {
    html += '<div class="lead-grid">';
    currentLeads.forEach(l => {
      const crm = l.crm || {};
      const fuDays = daysUntil(crm.followUpDate);
      let fuLabel = '';
      let fuClass = '';
      if (crm.followUpDate && fuDays !== null) {
        if (fuDays > 7) { fuLabel = `Follow up in ${fuDays} days`; fuClass = 'green'; }
        else if (fuDays > 0) { fuLabel = `Follow up in ${fuDays} days`; fuClass = 'orange'; }
        else if (fuDays === 0) { fuLabel = 'Follow up TODAY'; fuClass = 'warning'; }
        else { fuLabel = `Overdue by ${Math.abs(fuDays)} days`; fuClass = 'error'; }
      }
      const lastNote = crm.notes && crm.notes.length > 0 ? crm.notes[0] : null;
      const showDeleteConfirm = state.deleteConfirm[l.id];

      html += `
        <div class="card archive-card">
          <div class="lead-card-header">
            <div class="lead-card-name">${escapeHtml(l.businessName)}</div>
            <div style="display:flex;gap:var(--space-2);">
              ${l.industry ? `<span class="badge badge-neutral">${escapeHtml(l.industry)}</span>` : ''}
            </div>
          </div>
          <div class="archive-card-meta">
            <span class="badge ${getStageBadge(crm.stage || 1)}">${getStageName(crm.stage || 1)}</span>
            <span class="badge ${getDispositionBadge(crm.disposition)}">${getDispositionLabel(crm.disposition)}</span>
            ${crm.dateLastContact ? `<span style="color:var(--color-text-muted);">Last contact: ${formatDate(crm.dateLastContact)}</span>` : ''}
          </div>
          ${fuLabel ? `<div class="archive-follow-up ${fuClass}">${fuDays !== null && fuDays <= 0 ? '<i data-lucide="alert-triangle" style="width:12px;height:12px;display:inline;" aria-hidden="true"></i> ' : ''}${fuLabel}</div>` : ''}
          ${l.description ? `<p class="lead-card-desc" style="-webkit-line-clamp:1;">${escapeHtml(l.description)}</p>` : ''}
          ${lastNote ? `<p style="font-size:var(--text-xs);color:var(--color-text-faint);">${escapeHtml(lastNote.text).substring(0, 80)}${lastNote.text.length > 80 ? '...' : ''}</p>` : ''}
          ${renderAttribution(l)}
          ${renderLastActivity(l)}
          <div class="lead-card-actions">
            <button class="btn btn-primary btn-sm" data-action="reactivate" data-id="${l.id}"><i data-lucide="refresh-cw" aria-hidden="true"></i> Reactivate</button>
            <button class="btn btn-danger-ghost btn-sm" data-action="confirm-delete" data-id="${l.id}"><i data-lucide="trash-2" aria-hidden="true"></i> Delete</button>
          </div>
          ${showDeleteConfirm ? `
            <div class="confirm-delete">
              <span>Are you sure? This cannot be undone.</span>
              <button class="btn btn-danger-ghost btn-sm" data-action="delete-lead" data-id="${l.id}">Yes, delete</button>
              <button class="btn btn-ghost btn-sm" data-action="cancel-delete" data-id="${l.id}">Cancel</button>
            </div>
          ` : ''}
        </div>
      `;
    });
    html += '</div>';
  }

  container.innerHTML = html;
  lucide.createIcons({ nodes: [container] });
}

                <li><strong>Avoid these traps:</strong> Sloppy execution, missed deadlines without warning, "just enough" work, letting juniors close out subpar deliverables. These erode trust faster than anything.</li>
              </ul>
            </div>
          </div>

          <div class="accordion-item">
            <button class="accordion-trigger" data-accordion="pb2-reporting" aria-expanded="false">
              <span>Pillar 4: Reporting</span>
              <i data-lucide="chevron-down" class="acc-icon" aria-hidden="true"></i>
            </button>
            <div class="accordion-content" id="acc-pb2-reporting">
              <ul>
                <li><strong>Consistency:</strong> Same format, same day, same style. Every time. The client should know exactly what they're getting and when.</li>
                <li><strong>Insight:</strong> Interpret numbers, don't just share them. "CTR dropped 8%, likely creative fatigue, suggest refreshing with variation 3" is infinitely better than "CTR: 1.8%."</li>
                <li><strong>Strategic thinking:</strong> Tie numbers to decisions. Every data point should lead to a recommendation or validation of a current approach.</li>
                <li><strong>Client value:</strong> Spot new opportunities in the data. Be the one who says "I noticed X, have you considered Y?" That's how you become indispensable.</li>
              </ul>
              <div class="playbook-callout">
                <i data-lucide="lightbulb" aria-hidden="true"></i>
                <span>Report with diagnosis, not just data. "CTR dropped 8%, likely creative fatigue, suggest refreshing with variation 3" tells a story. "CTR: 1.8%" tells nothing.</span>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <button class="accordion-trigger" data-accordion="pb2-relationship" aria-expanded="false">
              <span>Pillar 5: Relationship</span>
              <i data-lucide="chevron-down" class="acc-icon" aria-hidden="true"></i>
            </button>
            <div class="accordion-content" id="acc-pb2-relationship">
              <ul>
                <li><strong>Trust:</strong> Follow through on every commitment. Trust is built in small moments, not grand gestures. Consistency compounds.</li>
                <li><strong>Respect:</strong> Maintain professional boundaries. You're friendly, not friends. This protects both sides.</li>
                <li><strong>Rapport:</strong> Be enjoyable to work with. Bring energy, positivity, and genuine interest. People choose to continue working with people they like.</li>
                <li><strong>Influence:</strong> Shape decisions, don't just execute them. When you have influence, you guide the direction rather than just following instructions.</li>
              </ul>
              <p style="margin-top:var(--space-3);"><strong>You've won when:</strong> the client brings you into strategic discussions, asks your opinion before making changes, listens when you push back, and you're guiding the relationship, not just serving it.</p>
            </div>
          </div>

        </div>
      </div>

      <!-- PLAYBOOK 3 -->
      <div class="playbook-card" id="playbook-3">

          <div class="playbook-title-area">

        </div>
        <div class="playbook-body" id="playbook-body-3">

          <div class="accordion-item">
            <button class="accordion-trigger" data-accordion="pb3-setup" aria-expanded="false">
              <span>Call 1: Set the Environment</span>
              <i data-lucide="chevron-down" class="acc-icon" aria-hidden="true"></i>
            </button>
            <div class="accordion-content" id="acc-pb3-setup">
              <ul>
                <li><strong>Join 2 minutes early.</strong> Never be the one the prospect is waiting for. Being early shows respect and professionalism.</li>
                <li><strong>Professional background:</strong> Clean, intentional. Your environment signals how seriously you take things.</li>
                <li><strong>Headphones:</strong> Always. No echo, no ambient noise. Audio quality is the silent trust signal.</li>
                <li><strong>Camera at eye level:</strong> Not looking down at the laptop. Position yourself as an equal, not someone hunched over a desk.</li>
              </ul>
            </div>
          </div>

          <div class="accordion-item">
            <button class="accordion-trigger" data-accordion="pb3-story" aria-expanded="false">
              <span>Call 1: Lead with Story</span>
              <i data-lucide="chevron-down" class="acc-icon" aria-hidden="true"></i>
            </button>
            <div class="accordion-content" id="acc-pb3-story">
              <ul>
                <li><strong>Start with YOUR story (60-90 seconds):</strong> Why you started, what you learned along the way, the types of businesses you work with. This is not a pitch, it's connection. Keep it human.</li>
                <li><strong>Invite their story:</strong> "Would love to hear about you, how did you get started?" Let them talk. Listen deeply. Note the details that matter to them.</li>
                <li><strong>Frame the call:</strong> "I want to walk through some ideas that could help. We've done our homework and spotted some interesting opportunities." This sets you up as prepared and proactive.</li>
              </ul>
            </div>
          </div>

          <div class="accordion-item">
            <button class="accordion-trigger" data-accordion="pb3-deck" aria-expanded="false">
              <span>Call 1: Using Your Deck</span>
              <i data-lucide="chevron-down" class="acc-icon" aria-hidden="true"></i>
            </button>
            <div class="accordion-content" id="acc-pb3-deck">
              <ul>
                <li><strong>Share a tab, not your screen.</strong> Use split view so you can see their reactions while presenting. Their face tells you more than their words.</li>
                <li><strong>The deck is a tool, not a script.</strong> Talk around the slides. Pause for their thoughts. Let the conversation flow naturally.</li>
                <li><strong>Go off-script when momentum builds.</strong> If they light up about something, dive deeper. The best conversations are the unplanned ones.</li>
                <li><strong>Share value mid-call:</strong> Pull up real examples, case studies, funnel breakdowns. Show, don't just tell. Make it tangible.</li>
              </ul>
            </div>
          </div>

          <div class="accordion-item">
            <button class="accordion-trigger" data-accordion="pb3-close1" aria-expanded="false">
              <span>Call 1: Close & Follow-up</span>
              <i data-lucide="chevron-down" class="acc-icon" aria-hidden="true"></i>
            </button>
            <div class="accordion-content" id="acc-pb3-close1">
              <ul>
                <li><strong>End with a clear next step:</strong> "Let's take a few days to digest this, then jump on a second call next week. I'll send over the slides and some tailored ideas."</li>
                <li><strong>Follow up within 2 hours with:</strong></li>
                <li>A summary of the key points discussed</li>
                <li>The deck (cleaned up if needed)</li>
                <li>A calendar link for Call 2</li>
                <li>3-5 tailored insights or examples specific to their business</li>
              </ul>
              <div class="playbook-callout">
                <i data-lucide="lightbulb" aria-hidden="true"></i>
                <span>The follow-up email is where deals are won or lost. Speed and quality both matter. Be the agency that follows up faster and better than anyone they've spoken to.</span>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <button class="accordion-trigger" data-accordion="pb3-call2-open" aria-expanded="false">
              <span>Call 2: Re-establish & Set Tone</span>
              <i data-lucide="chevron-down" class="acc-icon" aria-hidden="true"></i>
            </button>
            <div class="accordion-content" id="acc-pb3-call2-open">
              <ul>
                <li><strong>Small talk first:</strong> Reference something they mentioned on Call 1. "How did that product launch go?" This shows you listened and you care.</li>
                <li><strong>Set the tone with confidence:</strong> "Since our last call, I've been thinking about how we can help specifically. I've gone back to the team and put together something bespoke for you."</li>
                <li><strong>Present like an expert, not a vendor:</strong> Paint the future. Don't just describe services, describe what their business looks like 6 months from now with you involved.</li>
              </ul>
            </div>
          </div>

          <div class="accordion-item">
            <button class="accordion-trigger" data-accordion="pb3-call2-close" aria-expanded="false">
              <span>Call 2: Structure & Close</span>
              <i data-lucide="chevron-down" class="acc-icon" aria-hidden="true"></i>
            </button>
            <div class="accordion-content" id="acc-pb3-call2-close">
              <p><strong>The presentation structure that closes:</strong></p>
              <ul>
                <li><strong>01. Recap their problems:</strong> Mirror back what they told you. This proves you understood. "Last time we spoke, you mentioned X, Y, and Z..."</li>
                <li><strong>02. Frame your solution:</strong> Position your approach as the answer to their specific challenges. Not generic services, specific solutions.</li>
                <li><strong>03. Detail deliverables:</strong> What exactly will they get? Be concrete. Timelines, formats, outputs. Remove all ambiguity.</li>
                <li><strong>04. Set expectations:</strong> Communication rhythm (weekly updates, Slack access), lead times, review cycles. They should leave knowing exactly what working together feels like.</li>
              </ul>
              <p style="margin-top:var(--space-3);"><strong>Sell certainty:</strong> What happens in week 1? When do the first deliverables arrive? What does the communication rhythm look like? The prospect should leave the call with zero anxiety about what happens next.</p>
              <div class="playbook-callout">
                <i data-lucide="lightbulb" aria-hidden="true"></i>
                <span>You're not just selling a service, you're selling the feeling of being in safe, expert hands. Every word should build that certainty.</span>
              </div>
            </div>
          </div>

        </div>

            <div class="accordion-content" id="acc-pb4-not-interested">
              <p><strong>Response:</strong> "Totally understand. Quick question before I let you go, is it the timing, or is it that you don't see a need for [specific service]? Just want to make sure I'm not wasting your time if there's something specific we could help with down the line."</p>

            </button>
            <div class="accordion-content" id="acc-pb4-send-email">
              <p><strong>Response:</strong> "Absolutely, I'll send it over today. Just so I can make it relevant, is it the [Strategy/Experience/Commerce] side that's most interesting to you, or is it more general?"</p>
              <div class="playbook-callout">

                <span>This qualifies them AND gives you the angle for the email.</span>
              </div>

// Theme — persisted per device, and the browser-chrome colour follows it.
function updateThemeColorMeta() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const m = document.getElementById('meta-theme-color');
  if (m) m.setAttribute('content', dark ? '#151412' : '#f7f6f2');
}
function syncThemeToggleIcon() {
  const btn = document.getElementById('theme-toggle');
  if (!btn) return;
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  btn.innerHTML = dark ? '<i data-lucide="moon" aria-hidden="true"></i>' : '<i data-lucide="sun" aria-hidden="true"></i>';
  lucide.createIcons({ nodes: [btn] });
}
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  try { localStorage.setItem('crescendo-theme', next); } catch (_) {}
  syncThemeToggleIcon();
  updateThemeColorMeta();
}
function applySavedTheme() {
  let t = null;
  try { t = localStorage.getItem('crescendo-theme'); } catch (_) {}
  if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  syncThemeToggleIcon();
  updateThemeColorMeta();
}
document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

// ESC key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (_actionSheetResolve) { _resolveActionSheet(null); return; }
    if (isMoreSheetOpen()) { closeMoreSheet(); return; }
    if (state.modalOpen) closeModal();
    else if (state.panelOpen) closePanel();
    else if (state.crmSheetId) closeCRMSheet();
  }
});

// Global search — updates only the list, and mirrors the value into the section's own
// search box so the two never disagree.
document.getElementById('global-search').addEventListener('input', e => {
  const val = e.target.value.trim();
  if (state.activeSection === 'lead-bank') {
    state.filters.leadBank.search = val;
    savePrefs();
    state.lbLimit = LB_PAGE;
    const inSection = document.querySelector('#section-lead-bank [data-filter="lb-search"]');
    if (inSection && inSection.value !== val) inSection.value = val;
    renderLeadBankList();
  } else if (state.activeSection === 'crm') {
    state.filters.crm.search = val;
    savePrefs();
    state.crmLimit = CRM_PAGE;
    const inSection = document.querySelector('#section-crm [data-filter="crm-search"]');
    if (inSection && inSection.value !== val) inSection.value = val;
    renderCRMListView();
  }
});

// Home events
document.getElementById('section-home').addEventListener('click', e => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;
  if (action === 'home-contact-lead') {
    const lead = getLeadById(id);
    const hasPhone = lead && (((lead.phones || []).some(p => p && p.number)) || ((lead.contacts || []).some(c => c && c.phone)));
    if (hasPhone) { openDialer(id); return; } // "Contact Now" goes straight to the dialer
  }
  if (action === 'home-open-followups') { showSection('crm'); startWorkList(); return; }
  if (action === 'home-goto-lead' || action === 'home-contact-lead') {
    const lead = getLeadById(id);
    if (lead) {
      if (lead.status === 'crm') {
        // Land ON the lead, not just on the section. Dropping the rep into a 200-card list and
        // leaving them to find the name they just tapped was the old behaviour.
        showSection('crm');
        openCRMSheet(lead.id);
      }
      else if (lead.status === 'qualified') { showSection('qualified-leads'); openPanel('view-lead', lead); }
      else { showSection('lead-bank'); openPanel('view-lead', lead); }
    }
  }
});

// Map events (undisclosed-location list rows open the lead)
document.getElementById('section-map').addEventListener('click', e => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  if (target.dataset.action === 'view-lead') {
    openPanel('view-lead', getLeadById(target.dataset.id));
  }
});

// Lead Bank events
document.getElementById('section-lead-bank').addEventListener('click', e => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  if (action === 'open-add-lead') openPanel('add-lead');
  else if (action === 'call-lead') openDialer(id, target.dataset.num);
  else if (action === 'view-lead') openPanel('view-lead', getLeadById(id));
  else if (action === 'qualify') openModal('qualify', getLeadById(id));
  else if (action === 'move-to-crm') {
    const __mv = getLeadById(id);
    const __mvName = (__mv && __mv.businessName) ? __mv.businessName : 'Lead';
    moveToCRM(id);
    showToast(__mvName + ' moved to CRM / Outreach', 'success');
    renderAll();
  }
  else if (action === 'toggle-today-filter') {
    state.filters.leadBank.today = !state.filters.leadBank.today;
    savePrefs();
    state.lbLimit = LB_PAGE;
    renderLeadBank();
  }
  else if (action === 'show-more') {
    state.lbLimit = (state.lbLimit || LB_PAGE) + LB_PAGE;
    renderLeadBankList();
  }
  else if (action === 'bulk-clear') {
    state.bulkSelection = [];
    state.bulkScope = null;
    renderLeadBank();
  }
});
document.getElementById('section-lead-bank').addEventListener('input', e => {
  const f = e.target.dataset.filter;
  // List-only re-render: replacing the toolbar would destroy this input mid-keystroke.
  if (f === 'lb-search') { state.filters.leadBank.search = e.target.value; savePrefs(); state.lbLimit = LB_PAGE; renderLeadBankList(); }
});
document.getElementById('section-lead-bank').addEventListener('change', e => {
  const f = e.target.dataset.filter;
  const action = e.target.dataset.action;
  const id = e.target.dataset.id;
  if (action === 'bulk-toggle') {
    state.bulkScope = 'lead-bank';
    state.bulkSelection = state.bulkSelection || [];
    if (e.target.checked) {
      if (!state.bulkSelection.includes(id)) state.bulkSelection.push(id);
    } else {
      state.bulkSelection = state.bulkSelection.filter(x => x !== id);
    }
    renderLeadBank();
    return;
  }
  if (action === 'bulk-action') {
    applyBulkAction(e.target.dataset.scope, e.target.value);
    e.target.value = '';
    return;
  }
  if (f === 'lb-status') { state.filters.leadBank.status = e.target.value; savePrefs(); state.lbLimit = LB_PAGE; renderLeadBank(); }
  if (f === 'lb-source') { state.filters.leadBank.source = e.target.value; savePrefs(); state.lbLimit = LB_PAGE; renderLeadBank(); }
  if (f === 'lb-assigned') { state.filters.leadBank.assignedTo = e.target.value; savePrefs(); state.lbLimit = LB_PAGE; renderLeadBank(); }
  if (f === 'lb-sort') { state.filters.leadBank.sort = e.target.value; savePrefs(); state.lbLimit = LB_PAGE; renderLeadBank(); }
  if (f === 'lb-show-all') { state.filters.leadBank.assignedTo = e.target.checked ? 'all' : getCurrentUser(); savePrefs(); state.lbLimit = LB_PAGE; renderLeadBank(); }
});
document.getElementById('section-lead-bank').addEventListener('click', e => {
  const chip = e.target.closest('[data-filter="lb-mine"]');
  if (!chip) return;
  state.filters.leadBank.assignedTo = (state.filters.leadBank.assignedTo === getCurrentUser()) ? 'all' : getCurrentUser();
  savePrefs();
  state.lbLimit = LB_PAGE;
  renderLeadBank();
});

// Qualified Leads events
document.getElementById('section-qualified-leads').addEventListener('click', e => {
  const target = e.target.closest('[data-action]');

  if (action === 'qualify') openModal('qualify', getLeadById(id));

    showToast(__mvName + ' moved to CRM / Outreach', 'success');

  } else if (action === 'view-qual') {
    openPanel('view-qualification', getLeadById(id));
  } else if (action === 'toggle-qual-phone') {

// CRM events
document.getElementById('section-crm').addEventListener('click', e => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  if (action === 'call-lead') { openDialer(id, target.dataset.num); return; }
  if (action === 'open-crm-sheet') { openCRMSheet(id); return; }
  if (action === 'close-crm-sheet') { closeCRMSheet(); return; }
  if (action === 'crm-sheet-nav') {
    const dir = parseInt(target.dataset.dir, 10);
    if (Array.isArray(state.workList) && state.workList.length) {
      if (!advanceWorkList(dir) && dir > 0) finishWorkList();
      return;
    }
    const { leads } = getFilteredCRM();
    const order = leads.map(l => l.id);
    const i = order.indexOf(state.crmSheetId) + dir;
    if (i >= 0 && i < order.length) {
      state.crmDetailsOpen[state.crmSheetId] = false;
      openCRMSheet(order[i]);
    }
    return;
  }
  if (action === 'start-work-list') { startWorkList(); return; }
  if (action === 'finish-work-list') { finishWorkList(); return; }
  if (action === 'follow-up-filter') {
    const b = target.dataset.bucket;
    // Second tap on the active chip clears it — reps get stuck in a filter otherwise.
    state.filters.crm.followUp = (state.filters.crm.followUp === b) ? 'all' : b;
    savePrefs();
    state.crmLimit = CRM_PAGE;
    renderCRM();
    return;
  }
  if (action === 'toggle-worked-today') {
    state.filters.crm.touchedToday = !state.filters.crm.touchedToday;
    savePrefs();
    state.crmLimit = CRM_PAGE;
    renderCRM();
    return;
  }
  if (action === 'toggle-stalled') {
    state.filters.crm.stalled = !state.filters.crm.stalled;
    savePrefs();
    state.crmLimit = CRM_PAGE;
    renderCRM();
    return;
  }
  if (action === 'clear-crm-filters') { clearCRMFilters(); renderCRM(); return; }
  if (action === 'generate-email') {
    const lead = getLeadById(id);
    if (lead) openModal('email', lead);
    return;
  } else if (action === 'crm-view') {
    // The sheet reuses the list card markup, so it must not co-exist with the list view.
    state.crmSheetId = null;
    state.crmView = target.dataset.view;
    savePrefs();
    renderCRM();
  } else if (action === 'show-more') {
    state.crmLimit = (state.crmLimit || CRM_PAGE) + CRM_PAGE;
    renderCRMListView();
  } else if (action === 'crm-toggle-details') {
    // Toggle the card's detail editor in place — no re-render, so it feels instant.
    state.crmDetailsOpen[id] = !state.crmDetailsOpen[id];
    const det = document.getElementById('crm-details-' + id);
    if (det) det.classList.toggle('collapsed', !state.crmDetailsOpen[id]);
    target.classList.toggle('open', !!state.crmDetailsOpen[id]);
    target.setAttribute('aria-expanded', String(!!state.crmDetailsOpen[id]));
  } else if (action === 'kanban-move') {
    // Tap-based stage move — drag-and-drop is unusable on touch screens.
    const lead = getLeadById(id);
    if (lead && lead.crm) {
      const ns = Math.min(6, Math.max(1, (lead.crm.stage || 1) + parseInt(target.dataset.dir, 10)));
      if (setStage(lead, ns)) {
        saveState();
        if (ns === 6) openOutcomeReasonModal(id, 'won');
        else showToast(`${lead.businessName} moved to ${getStageName(ns)}`, 'info');
        renderCRM();
        renderSidebarBadges();
      }
    }
  } else if (action === 'cycle-priority') {
    const lead = getLeadById(id);
    if (lead && lead.crm) {
      const cycle = { high: 'medium', medium: 'low', low: 'high' };
      lead.crm.priority = cycle[lead.crm.priority];
      saveState();
      renderCRM();
    }
  } else if (action === 'follow-up-chip') {
    const lead = getLeadById(id);
    if (lead && lead.crm) {
      lead.crm.followUpDate = daysFromNow(parseInt(target.dataset.days));
      saveState();
      renderCRM();
    }
  } else if (action === 'toggle-meeting') {
    const lead = getLeadById(id);
    if (lead && lead.crm) {
      lead.crm.meetingBooked = !lead.crm.meetingBooked;
      if (lead.crm.meetingBooked) {
        if (!lead.crm.meetingDate) lead.crm.meetingDate = dateTimeFromNow(7, 10, 0);
        // The meeting IS the next action. Without this a booked lead had no follow-up date and
        // fell out of the due list until the day it was too late.
        lead.crm.followUpDate = String(lead.crm.meetingDate).split('T')[0];
        if ((lead.crm.stage || 1) < 3) setStage(lead, 3, { silent: true });
      }
      addActivity(lead, lead.crm.meetingBooked ? 'booked a meeting' : 'cancelled meeting');
      saveState();
      renderCRM();
      renderSidebarBadges();
    }
  } else if (action === 'add-note') {
    const input = document.getElementById('note-input-' + id);
    if (input && input.value.trim()) {
      addNote(id, input.value.trim());
      renderCRM();
    }
  } else if (action === 'expand-notes') {
    state.expandedNotes[id] = true;
    renderCRM();
  } else if (action === 'collapse-notes') {
    state.expandedNotes[id] = false;
    renderCRM();
  } else if (action === 'archive-lead') {
    const disposition = target.dataset.disposition;
    const lead = getLeadById(id);
    // Prompt for loss reason for not_interested / archived (task 6)
    if (lead && (disposition === 'not_interested' || disposition === 'archived')) {
      openOutcomeReasonModal(id, disposition);
      return;
    }
    const row = document.getElementById('crm-row-' + id);
    if (row) row.classList.add('lead-archiving');
    setTimeout(() => {
      archiveLead(id, disposition);
      showToast('Lead moved to Archive', 'info');
      renderAll();
    }, 300);
  } else if (action === 'generate-brief') {
    const lead = getLeadById(id);
    if (lead) openBriefModal(lead);
  } else if (action === 'toggle-today-filter') {
    const scope = target.dataset.scope;
    if (scope === 'crm') {
      state.filters.crm.today = !state.filters.crm.today;
      savePrefs();
      state.crmLimit = CRM_PAGE;
      renderCRM();
    } else if (scope === 'lead-bank') {
      state.filters.leadBank.today = !state.filters.leadBank.today;
      savePrefs();
      state.lbLimit = LB_PAGE;
      renderLeadBank();
    }
  } else if (action === 'bulk-clear') {
    state.bulkSelection = [];
    state.bulkScope = null;
    renderCRM();
  }
});
document.getElementById('section-crm').addEventListener('change', e => {
  if (e.target.dataset.action === 'log-call') {
    const outcome = e.target.value;
    if (outcome) {
      const id = e.target.dataset.id;
      const before = (getLeadById(id) || { crm: {} }).crm || {};
      const wasStage = before.stage;
      logCall(id, outcome);
      const lead = getLeadById(id);
      // Say what the app just booked, so the rep never has to go looking for the next step.
      let msg = 'Call logged: ' + callOutcomeLabel(outcome);
      if (lead && lead.crm) {
        if (lead.crm.stage !== wasStage) msg += ' · moved to ' + getStageName(lead.crm.stage);
        if (outcome !== 'not_interested' && lead.crm.followUpDate) msg += ' · follow up ' + formatDate(lead.crm.followUpDate);
      }
      showToast(msg, 'success');
      // Not interested is the end of the road: go straight to the reason + archive flow
      // rather than leaving the lead sitting in the pipeline.
      if (outcome === 'not_interested') { openOutcomeReasonModal(id, 'not_interested'); renderCRM(); renderSidebarBadges(); return; }
      // Working the list: this lead is done, move the rep straight on to the next one.
      if (Array.isArray(state.workList) && state.workList.length && state.crmSheetId === id) {
        if (!advanceWorkList(1)) finishWorkList();
        renderSidebarBadges();
        return;
      }
      renderCRM();
      renderSidebarBadges();
    }
    return;
  }
  const action = e.target.dataset.action;
  const id = e.target.dataset.id;
  const f = e.target.dataset.filter;

  if (action === 'change-stage') {
    const lead = getLeadById(id);
    if (lead && lead.crm) {
      const newStageNum = parseInt(e.target.value);
      // Prompt for win reason when moving to Closed Won (stage 6)
      if (newStageNum === 6 && lead.crm.stage !== 6) {
        setStage(lead, 6);
        saveState();
        openOutcomeReasonModal(id, 'won');
        renderCRM();
        renderSidebarBadges();
        return;
      }
      setStage(lead, newStageNum);
      saveState();
      const row = document.getElementById('crm-row-' + id);
      if (row) row.classList.add('stage-updated');
      renderCRM();
      renderSidebarBadges();
    }
  } else if (action === 'change-disposition') {
    const lead = getLeadById(id);
    if (lead && lead.crm) {
      const newDisp = e.target.value;
      if (newDisp === 'not_interested' || newDisp === 'archived') {
        openOutcomeReasonModal(id, newDisp);
      } else {
        lead.crm.disposition = newDisp;
        addActivity(lead, 'set disposition to ' + getDispositionLabel(newDisp));
        saveState();
      }
    }
  } else if (action === 'change-first-contact') {
    updateCRM(id, { dateFirstContact: e.target.value });
  } else if (action === 'change-last-contact') {
    updateCRM(id, { dateLastContact: e.target.value });
  } else if (action === 'change-follow-up') {
    updateCRM(id, { followUpDate: e.target.value });
    renderCRM();
  } else if (action === 'change-meeting-date') {
    updateCRM(id, { meetingDate: e.target.value });
  } else if (action === 'change-meeting-notes') {
    updateCRM(id, { meetingNotes: e.target.value });
  } else if (action === 'change-deal-value') {
    const v = parseFloat(e.target.value);
    updateCRM(id, { dealValue: Number.isFinite(v) && v >= 0 ? v : 0 });
    renderCRM();
  } else if (action === 'bulk-toggle') {
    const scope = e.target.dataset.scope;
    state.bulkScope = scope;
    state.bulkSelection = state.bulkSelection || [];
    if (e.target.checked) {
      if (!state.bulkSelection.includes(id)) state.bulkSelection.push(id);
    } else {
      state.bulkSelection = state.bulkSelection.filter(x => x !== id);
    }
    if (scope === 'crm') renderCRM(); else renderLeadBank();
  } else if (action === 'bulk-action') {
    applyBulkAction(e.target.dataset.scope, e.target.value);
    e.target.value = '';
  }

  if (f === 'crm-search') { state.filters.crm.search = e.target.value; savePrefs(); state.crmLimit = CRM_PAGE; renderCRMListView(); }
  if (f === 'crm-stage') { state.filters.crm.stage = e.target.value; savePrefs(); state.crmLimit = CRM_PAGE; renderCRM(); }
  if (f === 'crm-priority') { state.filters.crm.priority = e.target.value; savePrefs(); state.crmLimit = CRM_PAGE; renderCRM(); }
  if (f === 'crm-overdue') { state.filters.crm.overdueOnly = e.target.checked; savePrefs(); state.crmLimit = CRM_PAGE; renderCRM(); }
  if (f === 'crm-assigned') { state.filters.crm.assignedTo = e.target.value; savePrefs(); state.crmLimit = CRM_PAGE; renderCRM(); }
  if (f === 'crm-sort') { state.filters.crm.sort = e.target.value; savePrefs(); state.crmLimit = CRM_PAGE; renderCRM(); }
  if (f === 'crm-show-all') { state.filters.crm.assignedTo = e.target.checked ? 'all' : getCurrentUser(); savePrefs(); state.crmLimit = CRM_PAGE; renderCRM(); }

  // Research checklist
  if (action === 'research-check') {
    const lead = getLeadById(id);
    if (lead) {
      if (!lead.researchChecklist) lead.researchChecklist = [];
      const idx = parseInt(e.target.dataset.index);
      if (e.target.checked) { if (!lead.researchChecklist.includes(idx)) lead.researchChecklist.push(idx); }
      else { lead.researchChecklist = lead.researchChecklist.filter(i => i !== idx); }
      saveState();
    }

// Meetings events
document.getElementById('section-meetings').addEventListener('click', e => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  if (action === 'meetings-view') {
    state.meetingsView = target.dataset.view;
    savePrefs();
    renderMeetings();
  } else if (action === 'go-to-crm') {
    showSection('crm');
  } else if (action === 'mark-meeting-complete') {
    const lead = getLeadById(id);
    if (lead && lead.crm) {
      setStage(lead, 4);
      // The two days after a meeting are when the deal is won or lost. Book the follow-through
      // rather than leaving the lead with nothing due.
      lead.crm.followUpDate = daysFromNow(2);
      saveState();
      try { CrescendoSync.flush(); } catch (_) {}
      showToast('Meeting done. Follow up booked for ' + formatDate(lead.crm.followUpDate), 'success');
      renderAll();
    }
  } else if (action === 'reschedule-meeting') {
    const lead = getLeadById(id);
    if (lead && lead.crm) {
      // Simple: set to 1 week from now
      lead.crm.meetingDate = dateTimeFromNow(7, 10, 0);
      // Keep the follow-up pinned to the meeting so it shows in the due list on the day.
      lead.crm.followUpDate = String(lead.crm.meetingDate).split('T')[0];
      addActivity(lead, 'rescheduled meeting');
      saveState();
      try { CrescendoSync.flush(); } catch (_) {}
      showToast('Rebooked for ' + formatDate(lead.crm.followUpDate), 'info');
      renderMeetings();
    }
  } else if (action === 'go-to-crm-lead') {
    showSection('crm');
  } else if (action === 'cal-prev') {
    state.calendarMonth--;
    if (state.calendarMonth < 0) { state.calendarMonth = 11; state.calendarYear--; }
    renderMeetings();
  } else if (action === 'cal-next') {
    state.calendarMonth++;
    if (state.calendarMonth > 11) { state.calendarMonth = 0; state.calendarYear++; }
    renderMeetings();
  }
});

function getQualFormData() {
  return {
    strategyDesign: document.getElementById('q-strategyDesign')?.value || '',
    experienceDesign: document.getElementById('q-experienceDesign')?.value || '',
    digitalCommerce: document.getElementById('q-digitalCommerce')?.value || '',
    growthIntent: document.getElementById('q-growthIntent')?.value || '',
    weaknessesOpportunities: document.getElementById('q-weaknessesOpportunities')?.value || ''
  };
}
function updateQualDots() {
  const fields = ['strategyDesign', 'experienceDesign', 'digitalCommerce', 'growthIntent', 'weaknessesOpportunities'];
  const dots = document.querySelectorAll('#qual-dots .qual-dot');
  let filled = 0;
  fields.forEach((f, i) => {
    const el = document.getElementById('q-' + f);
    const hasTxt = el && el.value.trim().length > 0;
    if (hasTxt) filled++;
    if (dots[i]) {
      dots[i].classList.toggle('filled', hasTxt);
      dots[i].classList.toggle('empty', !hasTxt);
    }
  });
  const label = document.getElementById('qual-completeness');
  if (label) label.textContent = `Qualification Completeness: ${filled}/5 sections filled`;
}

  else if (action === 'call-lead') openDialer(target.dataset.id, target.dataset.num);

      showActionSheet({
        title: 'How did that call go?',
        message: lead.businessName,
        options: CALL_OUTCOMES.map(o => ({ label: o.label, value: o.value, icon: 'phone' }))
      }).then(outcome => {
        if (!outcome) return;
        const wasStage = (lead.crm || {}).stage;
        logCall(id, outcome);
        let msg = 'Call logged: ' + callOutcomeLabel(outcome);

          if (outcome !== 'not_interested' && lead.crm.followUpDate) msg += ' · follow up ' + formatDate(lead.crm.followUpDate);

document.getElementById('modal').addEventListener('keydown', e => {

  const modal = document.getElementById('modal');
  const focusable = modal.querySelectorAll('button, textarea, input, select, [tabindex]:not([tabindex="-1"])');
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

// Family key used to dedupe synthesized historical entries against real logged activity[]
// entries (same user + same kind of action + same calendar day).
function activityFamily(action) {
  const t = String(action || '').toLowerCase();
  if (t.includes('logged call') || t.includes('logged a call') || t.startsWith('called')) return 'call';
  if (t.includes('meeting')) return 'meeting';
  if (t.includes('disposition')) return 'disposition';
  if (t.includes('won')) return 'won';
  if (t.includes('reassigned')) return 'reassigned';
  if (t.includes('started working')) return 'started';
  if (t.includes('qualified')) return 'qualified';
  if (t.includes('moved to crm') || t.includes('crm')) return 'crm';
  if (t.includes('note')) return 'note';
  if (t.includes('stage')) return 'stage';
  if (t.includes('archived') || t.includes('archive')) return 'archived';
  if (t.includes('reactivated') || t.includes('reactivate')) return 'reactivated';
  return t;
}
function dayKey(isoDate) {
  const d = new Date(isoDate);
  return isNaN(d) ? String(isoDate || '') : d.toISOString().slice(0, 10);
}
// READ-ONLY: derive timeline entries from historical crm.* fields + status so the master sees
// past rep work that predates per-action activity[] logging. Never written back; tagged
// synthetic:true and "(historical)".
function getSynthesizedActivities(realKeys) {
  const out = [];
  state.leads.forEach(lead => {
    const crm = lead.crm || {};
    const owner = lead.assignedTo || lead.claimedBy || lead.movedToCRMBy || lead.qualifiedBy || 'Unknown';
    const base = { leadName: lead.businessName, leadId: lead.id, leadStatus: lead.status, synthetic: true };
    const candidates = [];
    if (crm.dateFirstContact) candidates.push({ by: owner, action: 'first contact (historical)', date: crm.dateFirstContact, _fam: 'call' });
    if (crm.dateLastContact && crm.dateLastContact !== crm.dateFirstContact) candidates.push({ by: owner, action: 'last contact (historical)', date: crm.dateLastContact, _fam: 'call' });
    if (crm.disposition && crm.disposition !== 'nurture' && crm.disposition !== '') candidates.push({ by: owner, action: 'disposition: ' + getDispositionLabel(crm.disposition) + ' (historical)', date: crm.dateLastContact || crm.dateMovedToCRM || lead.dateAdded, _fam: 'disposition' });
    if (crm.meetingBooked && crm.meetingDate) candidates.push({ by: owner, action: 'meeting booked (historical)', date: crm.meetingDate, _fam: 'meeting' });
    if (lead.qualifiedBy && lead.qualification && lead.qualification.dateQualified) candidates.push({ by: lead.qualifiedBy, action: 'qualified (historical)', date: lead.qualification.dateQualified, _fam: 'qualified' });
    if ((lead.movedToCRMBy || lead.status === 'crm') && crm.dateMovedToCRM) candidates.push({ by: lead.movedToCRMBy || owner, action: 'moved to CRM (historical)', date: crm.dateMovedToCRM, _fam: 'crm' });
    candidates.forEach(c => {
      if (!c.date) return;
      const k = (c.by || 'Unknown') + '|' + c._fam + '|' + dayKey(c.date);
      if (realKeys.has(k)) return; // a real logged activity already covers this user+family+day
      realKeys.add(k);
      out.push({ by: c.by || 'Unknown', action: c.action, date: c.date, ...base });
    });
  });
  return out;
}
function getAllActivities() {
  const activities = [];
  const realKeys = new Set();
  state.leads.forEach(lead => {
    if (!lead.activity) return;
    lead.activity.forEach(a => {
      if (!a || typeof a.action !== 'string') return; // guard malformed entries (M12)
      activities.push({ ...a, leadName: lead.businessName, leadId: lead.id, leadStatus: lead.status });
      realKeys.add((a.by || 'Unknown') + '|' + activityFamily(a.action) + '|' + dayKey(a.date));
    });
  });
  // Append read-only historical entries derived from crm.* fields/status.
  getSynthesizedActivities(realKeys).forEach(a => activities.push(a));
  activities.sort((a, b) => new Date(b.date) - new Date(a.date));
  return activities;
}

function formatActivityTime(isoDate) {
  const d = new Date(isoDate);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  const isYesterday = d.toDateString() === yesterday.toDateString();
  const hours = d.getHours();
  const mins = d.getMinutes().toString().padStart(2, '0');
  const ampm = hours >= 12 ? 'pm' : 'am';
  const h12 = hours % 12 || 12;
  const timeStr = h12 + ':' + mins + ampm;
  if (isToday) return 'Today at ' + timeStr;
  if (isYesterday) return 'Yesterday at ' + timeStr;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ', ' + timeStr;
}

function describeAction(action) {
  const action0 = String(action == null ? '' : action);
  const a = action0.toLowerCase();
  if (a.includes('logged call') || a.includes('logged a call') || a.startsWith('called')) return action0;
  if (a.includes('disposition')) return action0;
  if (a.includes('meeting')) return action0;
  if (a.includes('won')) return action0;
  if (a.includes('reassigned')) return action0;
  if (a.includes('started working')) return action0;
  if (a.includes('qualified')) return a.includes('historical') ? action0 : 'qualified';
  if (a.includes('moved to crm') || a.includes('crm')) return a.includes('historical') ? action0 : 'moved to CRM';
  if (a.includes('note') || a.includes('added note')) return 'added a note';
  if (a.includes('stage')) return 'changed stage to ' + action0.replace(/.*stage\s*(to\s*)?/i, '');
  if (a.includes('archived') || a.includes('archive')) return 'archived';
  if (a.includes('reactivated') || a.includes('reactivate')) return 'reactivated';
  return action0;
}

function matchesActionFilter(action, filter) {
  if (filter === 'all') return true;
  const a = String(action || '').toLowerCase();
  switch (filter) {
    case 'call': return a.includes('logged call') || a.includes('logged a call') || a.startsWith('called');
    case 'disposition': return a.includes('disposition');
    case 'meeting': return a.includes('meeting');
    case 'won': return a.includes('won');
    case 'reassigned': return a.includes('reassigned');
    case 'started': return a.includes('started working');
    case 'qualified': return a.includes('qualified');
    case 'moved to CRM': return (a.includes('moved to crm') || a.includes('crm')) && !a.includes('logged call');
    case 'note': return a.includes('note');
    case 'stage': return a.includes('stage');
    case 'archived': return a.includes('archived') || a.includes('archive');
    case 'reactivated': return a.includes('reactivated') || a.includes('reactivate');
    default: return true;
  }
}

function getActionBadgeClass(action) {
  const a = String(action || '').toLowerCase();
  if (a.includes('logged call') || a.includes('logged a call') || a.startsWith('called')) return 'badge-orange';
  if (a.includes('won')) return 'badge-success';
  if (a.includes('reassigned')) return 'badge-purple';
  if (a.includes('started working')) return 'badge-teal';
  if (a.includes('meeting')) return 'badge-purple';
  if (a.includes('disposition')) return 'badge-blue';
  if (a.includes('qualified')) return 'badge-teal';
  if (a.includes('crm')) return 'badge-blue';
  if (a.includes('note')) return 'badge-neutral';
  if (a.includes('stage')) return 'badge-purple';
  if (a.includes('archived') || a.includes('archive')) return 'badge-warning';
  if (a.includes('reactivated') || a.includes('reactivate')) return 'badge-success';
  return 'badge-neutral';
}

function renderActivityMonitor() {
  if (!canViewActivityMonitor()) return;
  const container = document.getElementById('activity-monitor-content');
  const allActivities = getAllActivities();

  // Read filter state
  const filterUser = state.amFilterUser || 'all';
  const filterAction = state.amFilterAction || 'all';
  const filterDate = state.amFilterDate || 'all';

  // Apply filters
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  // Monday-start week, unified with Reports (was Sunday-start here) (M3).
  const startOfWeek = new Date(startOfToday);
  startOfWeek.setDate(startOfWeek.getDate() - ((startOfWeek.getDay() + 6) % 7));

  let filtered = allActivities.filter(a => {
    if (filterUser !== 'all' && a.by !== filterUser) return false;
    if (!matchesActionFilter(a.action, filterAction)) return false;
    if (filterDate === 'today' && new Date(a.date) < startOfToday) return false;
    if (filterDate === 'week' && new Date(a.date) < startOfWeek) return false;
    return true;
  });

  // Stats
  const totalActions = allActivities.length;
  const actionsToday = allActivities.filter(a => new Date(a.date) >= startOfToday).length;
  const isCall = (a) => { const t = String(a.action || '').toLowerCase(); return t.includes('logged call') || t.includes('logged a call') || t.startsWith('called'); };
  const callsToday = allActivities.filter(a => isCall(a) && new Date(a.date) >= startOfToday).length;
  // Per-user "calls today" derived from the SAME filtered set the bars use, so the bar count
  // and the calls figure share one scope (L4).
  const callsTodayByUser = {};
  filtered.forEach(a => { if (isCall(a) && new Date(a.date) >= startOfToday) callsTodayByUser[a.by] = (callsTodayByUser[a.by] || 0) + 1; });
  const userCounts = {};
  allActivities.forEach(a => { userCounts[a.by] = (userCounts[a.by] || 0) + 1; });
  const mostActive = Object.entries(userCounts).sort((a, b) => b[1] - a[1])[0];
  const mostActiveName = mostActive ? mostActive[0] : 'N/A';

  // Filtered user counts for breakdown
  const filteredUserCounts = {};
  filtered.forEach(a => { filteredUserCounts[a.by] = (filteredUserCounts[a.by] || 0) + 1; });
  const maxCount = Math.max(...Object.values(filteredUserCounts), 1);

  const allUsers = [...new Set(allActivities.map(a => a.by))];

        <div class="am-user-count">${count}</div>

  container.innerHTML = `

    </div>
    <p style="font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:var(--space-6);">Track all team activity across every lead in real time.</p>

    <div class="am-stats-bar">
      <div class="am-stat-card">
        <div class="am-stat-label">Total Actions</div>
        <div class="am-stat-value">${totalActions}</div>
      </div>
      <div class="am-stat-card">
        <div class="am-stat-label">Actions Today</div>
        <div class="am-stat-value">${actionsToday}</div>
      </div>
      <div class="am-stat-card">
        <div class="am-stat-label">Calls Today</div>

      </div>

// ========== RENDER: REPORTS ==========
function renderReports() {
  const container = document.getElementById('reports-content');
  const dateRange = state.reportRange || 'week';
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfWeek = new Date(startOfToday); startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay() + 1);
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const startOfLastWeek = new Date(startOfWeek); startOfLastWeek.setDate(startOfLastWeek.getDate() - 7);
  const endOfLastWeek = new Date(startOfWeek);

  let rangeStart = null;
  if (dateRange === 'week') rangeStart = startOfWeek;
  else if (dateRange === 'lastweek') { rangeStart = startOfLastWeek; }
  else if (dateRange === 'month') rangeStart = startOfMonth;
  const rangeEnd = dateRange === 'lastweek' ? endOfLastWeek : now;

  function countActions(user, actionMatch) {
    return state.leads.reduce((count, lead) => {
      if (!lead.activity) return count;
      return count + lead.activity.filter(a => {
        if (user && a.by !== user) return false;
        if (rangeStart && new Date(a.date) < rangeStart) return false;
        if (rangeEnd && new Date(a.date) > rangeEnd) return false;
        if (actionMatch && !a.action.includes(actionMatch)) return false;
        return true;
      }).length;
    }, 0);
  }
  function countFollowUpsDue(user) {
    return state.leads.filter(l => {
      if (l.status !== 'crm' || !l.crm || !l.crm.followUpDate) return false;
      if (user && l.assignedTo !== user) return false;
      const d = daysUntil(l.crm.followUpDate);
      return d !== null && d <= 7;
    }).length;
  }

  // Real dialled/logged calls — previously this counted 'added lead' + 'changed stage',
  // which had nothing to do with calling.
  function countLoggedCalls(user) {
    return state.leads.reduce((count, lead) => {
      if (!lead.activity) return count;
      return count + lead.activity.filter(a => {
        if (user && a.by !== user) return false;
        if (rangeStart && new Date(a.date) < rangeStart) return false;
        if (rangeEnd && new Date(a.date) > rangeEnd) return false;
        const t = String(a.action || '').toLowerCase();
        return t.includes('logged call') || t.includes('logged a call') || t.startsWith('called');
      }).length;
    }, 0);
  }

  // Conversations = dials where the rep actually reached a human. Lumping those in with
  // voicemails made "Calls Logged" a measure of effort with nothing to show effectiveness.
  function countConversations(user) {
    return state.leads.reduce((count, lead) => {
      if (!lead.activity) return count;
      return count + lead.activity.filter(a => {
        if (user && a.by !== user) return false;
        if (rangeStart && new Date(a.date) < rangeStart) return false;
        if (rangeEnd && new Date(a.date) > rangeEnd) return false;
        const o = callOutcomeFromActivity(a.action);
        return !!o && o !== 'not_interested' && (CALL_NEXT_STEP[o] || {}).spoke;
      }).length;
    }, 0);
  }

  const currentUser = getCurrentUser();
  // SALES_TEAM, not [...CONSULTANTS, ...CEOS] — the 2026-07-30 selling-leaders change never
  // reached this screen, so the report listed oversight-only logins (all zeros, always) and
  // presented them alongside people who actually work leads.
  const users = canViewActivityMonitor() ? [...SALES_TEAM] : [currentUser];

  function renderUserStats(user) {
    const calls = countLoggedCalls(user);
    const convos = countConversations(user);
    const notes = countActions(user, 'added note');
    const qualified = countActions(user, 'qualified');
    const movedCRM = countActions(user, 'moved to CRM');
    // Meetings booked IN THIS RANGE. It used to count every meeting the rep had ever booked,
    // so the number sat still no matter which period you picked.
    const meetings = countActions(user, 'booked a meeting');
    const followUps = countFollowUpsDue(user);
    const connectRate = calls ? Math.round((convos / calls) * 100) : 0;
    return `
      <div class="report-user-card">
        <h3>${escapeHtml(user)}</h3>
        <div class="report-user-stat"><span>Calls Logged</span><strong>${calls}</strong></div>
        <div class="report-user-stat"><span>Conversations</span><strong>${convos}${calls ? ` <span class="report-rate">${connectRate}%</span>` : ''}</strong></div>
        <div class="report-user-stat"><span>Meetings Booked</span><strong>${meetings}</strong></div>
        <div class="report-user-stat"><span>Leads Qualified</span><strong>${qualified}</strong></div>
        <div class="report-user-stat"><span>Moved to CRM</span><strong>${movedCRM}</strong></div>
        <div class="report-user-stat"><span>Notes Added</span><strong>${notes}</strong></div>
        <div class="report-user-stat"><span>Follow-ups Due (7d)</span><strong>${followUps}</strong></div>
      </div>
    `;
  }

  const rangeLabels = { week: 'This Week', lastweek: 'Last Week', month: 'This Month', all: 'All Time' };

  container.innerHTML = `
    <div class="section-header">
      <h1>Reports</h1>
    </div>
    <p style="font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:var(--space-6);">Performance overview for your team.</p>
    <div class="filter-bar" style="margin-bottom:var(--space-6);">
      <select class="form-select" id="report-range" aria-label="Date range">
        ${['week','lastweek','month','all'].map(r => `<option value="${r}"${dateRange===r?' selected':''}>${rangeLabels[r]}</option>`).join('')}
      </select>
    </div>
    <div class="report-comparison">
      ${users.map(u => renderUserStats(u)).join('')}
    </div>
  `;
  lucide.createIcons({ nodes: [container] });
}
